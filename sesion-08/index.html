<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sesión 8 · Proceso y técnicas de venta — Presentación de clase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141a; --bg2:#1b1f29; --card:#222733; --card2:#2b3140; --ink:#f6f7fb; --mut:#a9b0c3;
  --or:#ff6b1a; --am:#ffc233; --mint:#2ee6a6; --pk:#ff4f8b; --cy:#3dd6f5; --vi:#a78bfa; --red:#ff5d5d;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#06070a;color:var(--ink);font-family:var(--font);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1200px 700px at 85% -10%,#2a1f3a 0%,transparent 60%),radial-gradient(900px 600px at -5% 105%,#3a2414 0%,transparent 60%),var(--bg);
  border-radius:6px}
#cv::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1.5px,transparent 1.5px);background-size:38px 38px;pointer-events:none}
#sl{position:absolute;inset:0;padding:64px 96px 70px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.kick{font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
.tm{font-size:24px;color:var(--mut);background:rgba(255,255,255,.06);padding:6px 18px;border-radius:99px}
h1{font-size:150px;line-height:1;font-weight:800;letter-spacing:-.03em}
h2{font-size:70px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:26px}
h2 em,h1 span{font-style:normal;color:var(--or)}
h3{font-size:38px;font-weight:700;margin-bottom:10px}
p,li{font-size:38px;line-height:1.35;color:#dfe3ef}
.sm{font-size:28px;color:var(--mut)}
.mut{color:var(--mut)}
b,strong{color:#fff}
.hl{color:var(--am)}
.grid{display:grid;gap:28px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border-radius:28px;padding:34px 36px;border:2px solid rgba(255,255,255,.06);position:relative}
.card .ic{font-size:70px;line-height:1;margin-bottom:14px;display:block}
.card p{font-size:32px}
.card h3{font-size:36px}
.num{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--or);color:#fff;font-weight:800;font-size:34px;margin-bottom:14px}
.btn{background:var(--or);color:#fff;font-weight:700;font-size:28px;padding:16px 30px;border-radius:99px;box-shadow:0 8px 24px rgba(255,107,26,.35);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:var(--card2);box-shadow:none}
.btn.mint{background:var(--mint);color:#06281c;box-shadow:0 8px 24px rgba(46,230,166,.3)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.callout{background:linear-gradient(90deg,rgba(255,194,51,.16),rgba(255,194,51,.04));border-left:8px solid var(--am);border-radius:18px;padding:22px 30px;font-size:34px;margin-top:26px}
.callout.or{background:linear-gradient(90deg,rgba(255,107,26,.2),rgba(255,107,26,.04));border-color:var(--or)}
.callout.mint{background:linear-gradient(90deg,rgba(46,230,166,.18),rgba(46,230,166,.04));border-color:var(--mint)}
.rv{opacity:0;transform:translateY(22px);transition:.4s;pointer-events:none}
.rv.on{opacity:1;transform:none;pointer-events:auto}
/* chips */
.chip{--c:#fff;display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--c) 22%,#1a1d26);border:3px solid var(--c);color:#fff;font-weight:700;font-size:25px;padding:6px 18px;border-radius:99px;white-space:nowrap;line-height:1.2}
button.chip:hover{filter:brightness(1.25)}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block}
/* cover */
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.cover .eyebrow{font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--am);text-transform:uppercase;margin-bottom:12px}
.cover .sub{font-size:52px;font-weight:700;margin-top:18px;color:#fff}
.cover .tag{font-size:36px;color:var(--mut);margin:10px 0 36px}
.cover .rules{display:flex;gap:18px;margin-bottom:30px}
.cover .rules div{background:var(--card);border-radius:20px;padding:16px 24px;font-size:27px;border:2px solid rgba(255,255,255,.07)}
.blob{position:absolute;right:-40px;top:40px;font-size:340px;opacity:.9;filter:drop-shadow(0 30px 60px rgba(255,107,26,.35));transform:rotate(-10deg)}
.blob2{position:absolute;right:120px;bottom:110px;font-size:150px;transform:rotate(14deg)}
/* vote */
.opts{display:grid;gap:12px;margin-top:4px}
.opt{display:grid;grid-template-columns:70px 1fr auto 56px;align-items:center;gap:20px;background:var(--card);border:3px solid rgba(255,255,255,.07);border-radius:22px;padding:8px 26px;min-height:84px;position:relative;overflow:hidden}
.opt .L{font-size:40px;font-weight:800;color:var(--am)}
.opt .tx{font-size:32px;line-height:1.15}
.opt .vc{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:760px}
.opt .cnt{font-size:36px;font-weight:800;text-align:right;color:var(--mut)}
.opt .bar{position:absolute;left:0;bottom:0;height:7px;background:var(--cy);transition:.4s}
.opt.ok{border-color:var(--mint);background:rgba(46,230,166,.13)}
.opt.ok .L{color:var(--mint)}
.opt.no{opacity:.45}
.tray{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:56px}
.tray .lbl{font-size:24px;color:var(--mut);margin-right:6px}
.hint{font-size:22px;color:var(--mut)}
.expl{margin-top:14px;font-size:30px;background:rgba(46,230,166,.12);border-left:8px solid var(--mint);padding:18px 26px;border-radius:16px}
.q{font-size:50px;line-height:1.12;font-weight:800;margin-bottom:16px}
.q.s{font-size:46px}
.case{font-size:34px;background:var(--card2);border-radius:20px;padding:14px 28px;margin-bottom:14px;border:2px dashed rgba(255,255,255,.18)}
/* flip */
.flip{perspective:1200px;height:520px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:34px;display:flex;flex-direction:column;justify-content:center;border:2px solid rgba(255,255,255,.08)}
.flip .fa{background:var(--card);align-items:center;text-align:center}
.flip .fa .ic{font-size:120px;margin-bottom:16px}
.flip .fa h3{font-size:44px}
.flip .fa small{font-size:24px;color:var(--mut);margin-top:12px}
.flip .fb{background:linear-gradient(160deg,#2f2147,#222733);transform:rotateY(180deg)}
.flip .fb p{font-size:28px;margin-bottom:12px}
.flip .fb b{color:var(--am)}
/* steps ladder */
.stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:end;height:620px}
.stair{background:var(--card);border-radius:28px;padding:30px;border:2px solid rgba(255,255,255,.07);display:flex;flex-direction:column;justify-content:flex-start}
.stair:nth-child(1){height:60%;border-top:10px solid var(--mint)}
.stair:nth-child(2){height:80%;border-top:10px solid var(--am)}
.stair:nth-child(3){height:100%;border-top:10px solid var(--pk)}
.stair h3{font-size:44px}.stair p{font-size:29px}
.tag2{display:inline-block;background:var(--or);color:#fff;font-weight:700;font-size:24px;border-radius:99px;padding:4px 16px;margin-bottom:10px}
/* timeline */
.tl{display:flex;flex-direction:column;gap:16px}
.tl .st{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;background:var(--card);border-radius:22px;padding:16px 26px;border:2px solid rgba(255,255,255,.06)}
.tl .st .yr{font-size:34px;font-weight:800;color:var(--or)}
.tl .st p{font-size:31px}
/* quadrants */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.quad .card{min-height:250px}
.quad h3{font-size:44px}
.quad .card p{font-size:29px}
/* clues */
.clue{background:var(--card);border-radius:22px;padding:20px 30px;font-size:38px;margin-bottom:14px;display:flex;gap:20px;align-items:center;border:2px solid rgba(255,255,255,.07)}
.clue .pt{font-weight:800;color:var(--am);font-size:30px;min-width:100px}
.answer{font-size:72px;font-weight:800;color:var(--mint);margin:16px 0}
/* podium */
.pod{display:flex;gap:30px;align-items:flex-end;justify-content:center;height:560px}
.pod .col{width:420px;text-align:center}
.pod .blk{border-radius:26px 26px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:22px;font-size:90px;font-weight:800}
.pod .nm{font-size:40px;font-weight:700;margin-bottom:10px}
.pod .pt{font-size:36px;color:var(--am);font-weight:700;margin-bottom:8px}
.confetti{position:absolute;top:-60px;font-size:44px;animation:fall 5s linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(1200px) rotate(360deg)}}
/* floating UI */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(14,16,22,.92);border:1px solid rgba(255,255,255,.14);padding:6px 10px;border-radius:99px;z-index:50;opacity:.55;transition:.2s;backdrop-filter:blur(6px)}
#bar:hover{opacity:1}
#bar button{background:transparent;font-size:15px;font-weight:600;padding:8px 12px;border-radius:99px;color:#e9ecf6;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar .ct{font-size:15px;color:#aab;padding:0 8px;min-width:64px;text-align:center}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--or);z-index:60;transition:.3s}
.panel{position:fixed;z-index:70;background:#171a23;border:1px solid rgba(255,255,255,.16);border-radius:20px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#score{top:14px;right:14px;width:430px;max-height:calc(100vh - 90px);overflow:auto;padding:18px;display:none}
#score h4,#modal h4,#goto h4{font-size:20px;margin-bottom:10px}
.sr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.sr .pts{font-weight:800;font-size:22px;color:var(--am);min-width:40px;text-align:right}
.sr .adj{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.sr .adj button,.mini{background:#2a3040;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px}
.sr .adj button:hover,.mini:hover{background:#3b4358}
.log{font-size:12px;color:#9aa;margin-top:10px;line-height:1.5}
#modal{top:50%;left:50%;transform:translate(-50%,-50%);width:640px;max-height:84vh;overflow:auto;padding:24px;display:none}
.tr{display:grid;grid-template-columns:24px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px}
.tr input{background:#0f1118;border:1px solid #3a4152;border-radius:10px;color:#fff;padding:8px 12px;font:600 16px var(--font);width:100%}
.tr .dot{width:22px;height:22px;border-radius:50%}
#goto{top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;max-width:94vw;max-height:86vh;overflow:auto;padding:22px;display:none}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.gg button{background:#222733;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.25}
.gg button small{display:block;color:var(--am);font-weight:600;font-size:12px;margin-bottom:2px}
.gg button.cur{outline:2px solid var(--or)}
.gg button:hover{background:#31384a}
#notes{left:50%;bottom:62px;transform:translateX(-50%);width:min(1100px,92vw);padding:18px 24px;display:none;font-size:17px;line-height:1.5;max-height:42vh;overflow:auto}
#notes b{color:var(--am)}
#timer{top:14px;left:14px;padding:10px 16px;display:none;align-items:center;gap:12px}
#timer .tt{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;min-width:150px}
#timer.end{background:#6b1414;animation:fl .5s 6}
@keyframes fl{50%{background:#a82020}}
#timer button{background:#2a3040;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
#rand{inset:0;border-radius:0;display:none;place-items:center;background:rgba(6,7,10,.9)}
#rand .box{text-align:center}
#rand .big{font-size:110px;font-weight:800;margin:20px 0;min-width:900px}
#rand .st{font-size:28px;color:var(--mut)}
.help{font-size:13px;color:#8d96ab;margin-top:12px;line-height:1.6}
kbd{background:#2a3040;border-radius:6px;padding:1px 7px;font-size:12px}
.fb{display:flex}

/* ---- Arena / juego ---- */
#cv.game{background:radial-gradient(1100px 650px at 90% -10%,#4a1a6b 0%,transparent 60%),radial-gradient(900px 600px at -5% 105%,#0f4a63 0%,transparent 60%),#0d0f1a}
.game .kick{color:var(--cy)}
.gbanner{display:flex;align-items:center;gap:22px;margin-bottom:10px}
.gb1{font-weight:800;font-size:24px;letter-spacing:.12em;color:#0d0f1a;background:var(--am);padding:6px 18px;border-radius:10px}
.gbanner b{font-size:34px;font-weight:800;color:#fff;letter-spacing:.04em}
.gb2{font-size:24px;color:var(--mut)}
.gtitle{font-size:56px;font-weight:800;line-height:1.1;margin:4px 0 14px}
.gtitle em{font-style:normal;color:var(--cy)}
.cover .rules{max-width:1380px;flex-wrap:wrap}
.qrbox{position:absolute;right:0;bottom:40px;width:250px;background:#fff;border-radius:22px;padding:14px;text-align:center;color:#111;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:3}
.qrbox svg{width:100%;height:auto;display:block}
.qrbox b{display:block;color:#111;font-size:26px;margin-top:6px}
.qrbox span{display:block;color:#444;font-size:19px;line-height:1.2}
.qrbox.lv{right:290px}
#live{inset:0;border-radius:0;display:none;background:rgba(6,7,10,.96);padding:60px;overflow:auto}
.lvwrap{display:flex;gap:60px;align-items:center;justify-content:center;min-height:100%}
.lvqr{width:560px;max-width:42vw;background:#fff;border-radius:28px;padding:20px;flex:none}.lvqr svg{width:100%;height:auto;display:block}
.lvinfo{max-width:760px}.lvinfo h4{font-size:34px;margin-bottom:10px}
.lvbig{font-size:54px;font-weight:800;line-height:1.1;margin:8px 0 16px}
.lvurl{font-size:15px;color:var(--mut);word-break:break-all}
.lvst{font-size:22px;margin:16px 0}
.lvteams{display:flex;flex-wrap:wrap;gap:8px}
.lvhelp{font-size:15px;color:var(--mut);margin-top:18px;line-height:1.45}
#bar button.liveon{background:#0f3a2c;color:#2ee6a6}
.tl4 .card p{font-size:26px}.tl4 .card h3{font-size:32px}.tl4 .card{padding:24px 26px}
.strip{position:absolute;left:96px;right:96px;bottom:62px;display:flex;gap:10px;flex-wrap:wrap}
.sc{flex:1;min-width:150px;background:rgba(255,255,255,.07);border-radius:14px;padding:6px 12px 10px;border-left:6px solid var(--c);position:relative;overflow:hidden}
.sc .n{font-size:18px;color:#cfd4e6;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-size:34px;line-height:1.05;display:block}
.sc i{position:absolute;left:0;bottom:0;height:6px;background:var(--c);transition:width .8s}
.sc.bump{animation:bump 1s;box-shadow:0 0 0 3px var(--mint)}
.sc.drop{animation:shk .6s;box-shadow:0 0 0 3px var(--red)}
@keyframes bump{30%{transform:scale(1.12)}}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}}
.clue.lock{opacity:.4}
.cbar{height:16px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--am),var(--red));transition:width .25s linear}
.buzzed{font-size:44px;font-weight:800;margin:8px 0 12px;animation:pin .4s}
.chip.locked{opacity:.5;text-decoration:line-through}
.btn.big{font-size:34px;padding:20px 44px}
.btn.red{background:var(--red);box-shadow:0 8px 24px rgba(255,93,93,.35)}
.pop-in{animation:pin .5s}
@keyframes pin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.obox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.ob{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 18px;font-size:27px;line-height:1.2}
.ob b{color:var(--am);margin-right:8px}
.ob.ok{background:rgba(46,230,166,.2);outline:3px solid var(--mint)}.ob.no{opacity:.45}
.bt{display:flex;flex-direction:column;gap:6px}
.br{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:14px;padding:5px 10px}
.br .chip{min-width:190px;font-size:20px}
.cell{width:56px;height:48px;border-radius:12px;background:#2a3040;font-size:24px;font-weight:800;color:#cfd4e6}
.cell:hover{background:#3b4358}
.cell.sel{background:var(--cy);color:#06222b}
.cell.ok{outline:4px solid var(--mint)}
.cell.bad{background:var(--red);color:#fff}
.bb{margin-left:auto;min-width:64px;height:48px;border-radius:12px;background:var(--am);color:#2b1f00;font-size:26px;font-weight:800}
.dice{font-size:150px;line-height:1;margin:6px 0}
.steal{font-size:38px;margin-top:14px;background:rgba(255,93,93,.15);border-left:8px solid var(--red);padding:14px 26px;border-radius:16px}
.card.glow{box-shadow:0 0 30px rgba(61,214,245,.18);border-color:rgba(61,214,245,.35)}
.pop{position:absolute;font-size:60px;pointer-events:none;z-index:40;animation:pp 1.6s ease-out forwards}
@keyframes pp{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}

.tb{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:4px}
.tb th{font-size:22px;color:var(--am);text-align:left;padding:0 18px;letter-spacing:.08em;text-transform:uppercase}
.tb td{background:var(--card);font-size:30px;line-height:1.18;padding:11px 18px;vertical-align:middle}
.tb td:first-child{border-radius:16px 0 0 16px}.tb td:last-child{border-radius:0 16px 16px 0}
.tb td.warn{color:#ffb4c8}
.formula{margin-top:14px;background:rgba(255,194,51,.12);border-left:6px solid var(--am);border-radius:12px;padding:12px 18px;font-size:28px;font-weight:700;color:var(--am)}
.fun{display:flex;flex-direction:column;align-items:center;gap:10px}
.fs{background:linear-gradient(90deg,#ff6b1a,#ff9a3d);border-radius:16px;padding:16px 10px;text-align:center;font-size:30px;color:#fff}
.fs b{color:#fff}.fs.post{background:linear-gradient(90deg,#2a8cff,#3dd6f5);width:100%}
.vc2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.vc2 .chip{font-size:18px;padding:2px 10px}
.qcd{font-size:34px;font-weight:800;color:var(--am);background:rgba(255,194,51,.12);padding:6px 20px;border-radius:99px}.qcd.done{color:var(--mint)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.cover .qrbox.lv{right:0;bottom:30px}
.qrbox.act{right:0;bottom:0;position:static;width:300px}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"><div id="cv"><div id="sl"></div></div></div>

<div id="bar">
  <button data-b="prev" title="Anterior (←)">◀</button>
  <span class="ct" id="ct">1 / 1</span>
  <button data-b="next" title="Siguiente (→ / espacio)">▶</button>
  <button data-b="goto" title="Ir a… (G)">☰ Ir a</button>
  <button data-b="score" title="Marcador (S)">🏆 Marcador</button>
  <button data-b="teams" title="Equipos (E)">👥 Equipos</button>
  <button data-b="rand" title="Equipo al azar (R)">🎲 Al azar</button>
  <button data-b="timer" title="Temporizador (T)">⏱</button>
  <button data-b="notes" title="Notas de la profesora (N)">📝 Guía</button>
  <button data-b="live" title="En vivo con celulares (L)">📡 En vivo</button>
  <button data-b="fs" title="Pantalla completa (F)">⛶</button>
</div>

<div class="panel" id="modal"></div>

<div class="panel" id="notes"></div>

<div class="panel" id="rand"><div class="box"><div class="st">Equipo elegido al azar</div><div class="big" id="rbig">…</div><div class="row" style="justify-content:center"><button class="btn" id="ragain">🎲 Otra vez</button><button class="btn alt" id="rclose">Cerrar</button></div></div></div>

<script>
(function(){
'use strict';
/* ================= Estado ================= */
const KEY='s8_ventas_presentacion_v2';
const COLORS=['#ff6b1a','#3dd6f5','#ffc233','#ff4f8b','#2ee6a6','#a78bfa','#ff5d5d','#60a5fa','#f59e0b','#34d399','#e879f9','#94a3b8'];
function defTeams(n){const a=[];for(let i=1;i<=n;i++)a.push({id:i,name:'Equipo '+i,c:(i-1)%COLORS.length});return a;}
function fresh(){return {teams:defTeams(8),idx:0,votes:{},bets:{},rev:{},rvn:{},log:[],stars:{},clue:{},pairs:null,steal:{t:null,v:null,n:1,q:null,res:null,show:false,used:[],sid:null},nid:100,seq:0,setup:false,dv:{},people:{},asked:{},qmeta:{},stealN:0,qt:{}};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||!S.teams){S=fresh();}
S.bets=S.bets||{};S.dv=S.dv||{};S.qt=S.qt||{};S.people=S.people||{};S.asked=S.asked||{};S.qmeta=S.qmeta||{};S.stealN=S.stealN||0;S.steal=S.steal||{t:null,v:null,n:1};S.steal.used=S.steal.used||[];S.clue=S.clue||{};S.stars=S.stars||{};
Object.keys(S.clue).forEach(function(k){const c=S.clue[k];if(!c||c.st===undefined||c.st==='run'||c.st==='buzz'){delete S.clue[k];}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const sl=$('#sl'),cv=$('#cv');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const team=id=>S.teams.find(t=>t.id==id);
const col=t=>COLORS[t.c%COLORS.length];
const pts=id=>S.log.filter(l=>l.team==id).reduce((a,l)=>a+l.d,0);
function addLog(teamId,d,why,sid,p){const e={id:++S.seq,team:teamId,d:d,why:why,sid:sid||''};if(p)e.p=p;S.log.push(e);}
function chip(t,act,sid){
  return '<button class="chip" style="--c:'+col(t)+'" '+(act?'data-act="'+act+'" ':'')+'data-team="'+t.id+'"'+(sid?' data-sid="'+sid+'"':'')+'><i></i>'+esc(t.name)+'</button>';
}
function chipStatic(t){return '<span class="chip" style="--c:'+col(t)+'"><i></i>'+esc(t.name)+'</span>';}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= Diapositivas ================= */
const SL=[];
function add(o){SL.push(o);}
const lastShown={};

/* ---------- Sonidos ---------- */
let AC=null;
function tone(f,d,at,type,vol){
  try{const A=window.AudioContext||window.webkitAudioContext;if(!AC)AC=new A();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;
    const t0=AC.currentTime+(at||0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}
}
function sfx(k){
  if(k==='ok'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.09));}
  else if(k==='no'){tone(180,.35,0,'sawtooth',.2);tone(140,.4,.12,'sawtooth',.2);}
  else if(k==='buzz'){tone(740,.12,0,'square',.2);tone(990,.2,.1,'square',.2);}
  else if(k==='start'){[392,523,659].forEach((f,i)=>tone(f,.14,i*.12));}
  else if(k==='tick'){tone(880,.08,0,'square',.12);}
  else if(k==='dice'){tone(300+Math.random()*300,.05,0,'square',.1);}
  else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,i*.1));}
}
function burst(emojis){
  const arr=emojis||['🎉','⭐','✨','🚀','🧩'];
  for(let i=0;i<26;i++){
    const s=document.createElement('span');s.className='pop';s.textContent=arr[i%arr.length];
    s.style.left=(200+Math.random()*1500)+'px';s.style.top=(300+Math.random()*400)+'px';
    s.style.setProperty('--dx',(Math.random()*400-200)+'px');s.style.setProperty('--dy',(-200-Math.random()*300)+'px');
    cv.appendChild(s);setTimeout(()=>s.remove(),1700);
  }
}

/* ---------- Marcador de juego (franja inferior) ---------- */
function strip(){
  const mx=Math.max(10,...S.teams.map(t=>pts(t.id)));
  const h=S.teams.map(function(t){
    const p=pts(t.id),bump=(lastShown[t.id]!==undefined&&p>lastShown[t.id])?' bump':'',drop=(lastShown[t.id]!==undefined&&p<lastShown[t.id])?' drop':'';
    lastShown[t.id]=p;
    return '<div class="sc'+bump+drop+'" style="--c:'+col(t)+'"><span class="n">'+esc(t.name)+(S.stars[t.id]?' ⭐':'')+'</span><b>'+p+'</b><i style="width:'+Math.max(3,100*Math.max(0,p)/mx)+'%"></i></div>';
  }).join('');
  return '<div class="strip">'+h+'</div>';
}
function banner(round,sub){
  return '<div class="gbanner"><span class="gb1">🎮 ARENA DE VENTAS</span><b>'+round+'</b><span class="gb2">'+sub+'</span></div>';
}

/* ---------- Helpers de modo en vivo / respuestas por persona ---------- */
function liveOn(){return typeof LV!=='undefined'&&LV.on;}
function dvOf(sid){return S.dv[sid]||{};}
function members(sid,tid){const d=dvOf(sid);return Object.keys(d).filter(k=>d[k].tm==tid).map(k=>Object.assign({dev:k},d[k])).sort((a,b)=>a.ts-b.ts);}
function connected(tid){const n=Date.now();return Object.keys(LV.pres).filter(k=>LV.pres[k].tm==tid&&n-LV.pres[k].ts<45000).length;}
function useLive(sid){return liveOn()||Object.keys(dvOf(sid)).length>0;}
function progChips(sid){
  const tot=Object.keys(dvOf(sid)).length;
  return '<div class="tray"><span class="lbl">📲 Respondieron ('+tot+'):</span>'+S.teams.map(function(t){
    const a=members(sid,t.id).length,c=Math.max(connected(t.id),a);
    return '<span class="chip" style="--c:'+col(t)+'"><i></i>'+esc(t.name)+' '+((a>=c&&c>0)?'✔ ':'')+a+'/'+c+'</span>';}).join('')+'</div>';
}
function distChips(sid,i,manualVotes){
  let h='';
  S.teams.forEach(function(t){
    const ms=members(sid,t.id);
    if(ms.length){const n=ms.filter(m=>m.i===i).length;if(n)h+='<span class="chip" style="--c:'+col(t)+'"><i></i>'+esc(t.name)+' ×'+n+'</span>';}
    else if(manualVotes&&manualVotes[t.id]===i)h+=chipStatic(t);
  });
  return h;
}
function countOpt(sid,i,manualVotes){
  let n=0;S.teams.forEach(function(t){const ms=members(sid,t.id);if(ms.length)n+=ms.filter(m=>m.i===i).length;else if(manualVotes&&manualVotes[t.id]===i)n++;});return n;
}

/* ---------- Tiempo de respuesta: 40 s antes de revelar ---------- */
const QSEC=40;
function qStatus(sid){const t=S.qt[sid];if(!t)return {st:'idle',left:QSEC};const left=Math.max(0,(t.end-Date.now())/1000);return {st:(left>0&&!t.done)?'run':'done',left:left};}
function qCtl(sid,rev){
  if(rev)return '';const s=qStatus(sid);
  if(s.st==='idle')return '<button class="btn" data-act="qStart" data-sid="'+sid+'">▶ Iniciar '+QSEC+' s</button>';
  if(s.st==='run')return '<span class="qcd" id="qcd">⏱ '+Math.ceil(s.left)+' s</span><button class="btn alt" style="font-size:20px;padding:8px 16px" data-act="qSkip" data-sid="'+sid+'">⏭ Cerrar ya</button>';
  return '<span class="qcd done">⏱ Tiempo cumplido</span>';
}
function qTick(){
  const s=SL[S.idx];if(!s)return;const sid=(s.vote||s.bet)?s.id:((s.id==='robo'&&S.steal.sid)?S.steal.sid:null);if(!sid)return;
  const t=S.qt[sid];if(!t||t.done)return;const left=(t.end-Date.now())/1000;
  if(left<=0){t.done=true;sfx('no');render();return;}
  const e=document.getElementById('qcd');if(e)e.textContent='⏱ '+Math.ceil(left)+' s';
}
setInterval(qTick,250);

/* ---------- Votación simple (contenido) ---------- */
function voteSlide(o){
  return {id:o.id,blk:o.blk,t:o.t,title:o.title||o.q,notes:o.notes||'',
  html:function(s){
    const v=S.votes[s.id]||{},rev=!!S.rev[s.id],live=useLive(s.id);
    let tot=0;const cnts=o.opts.map((_,i)=>{const n=countOpt(s.id,i,live&&!liveOn()?v:(live?v:v));tot+=n;return n;});tot=Math.max(1,tot);
    const opts=o.opts.map(function(tx,i){
      let cls='';if(rev&&o.correct!=null)cls=(o.correct===i)?' ok':' no';
      let vc='';
      if(live){vc=rev?distChips(s.id,i,v):'';}
      else{vc=S.teams.filter(t=>v[t.id]===i).map(t=>chip(t,rev?'':'cyc',s.id)).join('');}
      const showN=(!live||rev);
      return '<div class="opt'+cls+'"><span class="L">'+(o.labels?o.labels[i]:'ABCD'[i])+'</span><span class="tx">'+tx+'</span><span class="vc">'+vc+'</span><span class="cnt">'+(showN?cnts[i]:'')+'</span><span class="bar" style="width:'+(showN?100*cnts[i]/tot:0)+'%"></span></div>';
    }).join('');
    const none=S.teams.filter(t=>v[t.id]==null);
    return (o.case?'<div class="case">'+o.case+'</div>':'')+'<div class="q'+(o.small?' s':'')+'">'+o.q+'</div>'
      +'<div class="opts">'+opts+'</div>'
      +(live&&!rev?progChips(s.id)
        :(live?'':'<div class="tray"><span class="lbl">'+(none.length?'Sin respuesta · toca para asignar:':'¡Todos respondieron!')+'</span>'+none.map(t=>chip(t,rev?'':'cyc',s.id)).join('')+'</div>'))
      +'<div class="row" style="margin-top:10px">'+qCtl(s.id,rev)+'<button class="btn'+(rev?' alt':'')+'" data-act="reveal" data-sid="'+s.id+'"'+((!rev&&qStatus(s.id).st!=='done')?' disabled':'')+'>'+(rev?'Ocultar respuesta':'✔ Revelar y puntuar')+'</button>'
      +'<span class="hint">'+(live?'Cada alumno responde una vez desde su celular. ':'Cada equipo decide en 40 s. Toca el equipo para asignarle su letra. ')+(o.pts?('Acierto +'+o.pts+' por integrante.'):'')+'</span></div>'
      +(rev&&o.explain?'<div class="expl">'+o.explain+'</div>':'')+(o.extra||'');
  },
  vote:o};
}

/* ---------- Ronda de pistas con buzzer (juego) ---------- */
function cs(id){return S.clue[id]||(S.clue[id]={st:'idle',n:1,el:0,t0:0,buzz:null,locked:[],w:null,bd:null});}
function clueSlide(o){
  return {id:o.id,blk:o.blk,t:o.t,title:o.title,notes:o.notes||'',game:true,
  html:function(s){
    const c=cs(s.id),P=[3,2,1];let h=banner(o.round,'Pista nueva cada 5 s · ¡toca tu equipo para frenar!');
    h+='<div class="gtitle">'+o.title+'</div>';
    for(let i=0;i<3;i++){
      const shown=(c.st==='idle')?false:(i<c.n)||c.st==='done';
      h+='<div class="clue'+(shown?'':' lock')+'"><span class="pt">'+P[i]+' pts</span><span>'+(shown?o.clues[i]:'🔒 Pista '+(i+1)+' · aún oculta')+'</span></div>';
    }
    h+='<div class="cbar"><i id="cbf" style="width:'+Math.min(100,(c.st==='run'?(Date.now()-c.t0)/150:(c.el||0)/.15))+'%"></i></div>';
    if(c.st==='idle'){h+='<div class="row" style="margin:14px 0"><button class="btn big" data-act="cStart" data-sid="'+s.id+'">▶ ¡Arrancar ronda!</button><span class="sm">'+(liveOn()?'Los celulares ya muestran el botón ¡YO!':'Los equipos esperan listos…')+'</span></div>';}
    else if(c.st==='run'){h+='<div class="tray"><span class="lbl">🔔 BUZZER:</span>'+S.teams.map(t=>(c.locked.indexOf(t.id)>-1)?'<span class="chip locked" style="--c:#555">🚫 '+esc(t.name)+'</span>':chip(t,'cBuzz',s.id)).join('')+'</div>';}
    else if(c.st==='buzz'){const t=team(c.buzz),pp=c.bd&&S.people[c.bd];h+='<div class="buzzed">🔔 ¡'+(t?chipStatic(t):'')+' frenó la ronda!'+(pp?' <span class="sm">'+esc(pp.nombre)+'</span>':'')+'</div><div class="row"><button class="btn mint" data-act="cOk" data-sid="'+s.id+'">✔ Correcto (+'+P[c.n-1]+')</button><button class="btn red" data-act="cNo" data-sid="'+s.id+'">✖ Incorrecto (−1 y bloqueado)</button></div>';}
    else{h+='<div class="answer pop-in">✔ '+o.answer+'</div><div class="row">'+(c.w?('<span class="sm">¡Punto para</span>'+chipStatic(team(c.w)||{name:'—',c:0})):'<span class="sm">Nadie acertó</span>')+'<button class="btn alt" data-act="cReset" data-sid="'+s.id+'">↺ Repetir ronda</button></div>';}
    return h+strip();
  },clue:o};
}
function tickClue(){
  const s=SL[S.idx];if(!s||!s.id||!s.game)return;const c=S.clue[s.id];if(!c||c.st!=='run')return;
  const el=(Date.now()-c.t0)/1000,nn=Math.min(3,1+Math.floor(el/5));
  if(nn!==c.n){c.n=nn;sfx('tick');render();return;}
  const f=document.getElementById('cbf');if(f)f.style.width=Math.min(100,el/15*100)+'%';
  if(el>=15){c.st='done';c.w=0;c.el=15;sfx('no');save();render();}
}
setInterval(tickClue,250);

/* ---------- Ronda con apuesta (juego) ---------- */
function betSlide(o){
  return {id:o.id,blk:o.blk,t:o.t,title:o.title||o.q,notes:o.notes||'',game:true,bet:o,
  html:function(s){
    const v=S.votes[s.id]||{},bt=S.bets[s.id]||{},rev=!!S.rev[s.id],live=useLive(s.id);
    let h=banner(o.round,'Apuesta 1–3 pts: aciertas y ganas lo apostado, fallas y lo pierdes');
    h+='<div class="gtitle">'+o.q+'</div>';
    h+='<div class="obox">'+o.opts.map((tx,i)=>'<div class="ob'+(rev?(o.correct===i?' ok':' no'):'')+'"><b>'+('ABCD'[i])+'</b> '+tx+(rev&&live?'<div class="vc2">'+distChips(s.id,i,v)+'</div>':'')+'</div>').join('')+'</div>';
    if(live){h+=progChips(s.id);}
    else{
      const half=Math.ceil(S.teams.length/2);
      const tbl=function(arr){return '<div class="bt">'+arr.map(function(t){
        const sel=v[t.id],b=bt[t.id]||1;
        return '<div class="br">'+chipStatic(t)+o.opts.map(function(_,i){
          let cls='cell';if(sel===i)cls+=' sel';if(rev&&o.correct===i)cls+=' ok';if(rev&&sel===i&&o.correct!==i)cls+=' bad';
          return '<button class="'+cls+'" '+(rev?'':'data-act="bcell" ')+'data-sid="'+s.id+'" data-team="'+t.id+'" data-i="'+i+'">'+'ABCD'[i]+'</button>';
        }).join('')+'<button class="bb" '+(rev?'':'data-act="bbet" ')+'data-sid="'+s.id+'" data-team="'+t.id+'">×'+b+'</button></div>';}).join('')+'</div>';};
      h+='<div class="grid g2" style="gap:30px;margin-top:10px">'+tbl(S.teams.slice(0,half))+tbl(S.teams.slice(half))+'</div>';
    }
    h+='<div class="row" style="margin-top:12px">'+qCtl(s.id,rev)+'<button class="btn'+(rev?' alt':' big')+'" data-act="bReveal" data-sid="'+s.id+'"'+((!rev&&qStatus(s.id).st!=='done')?' disabled':'')+'>'+(rev?'Ocultar respuesta':'🎯 ¡Revelar!')+'</button><span class="hint">'+(live?'Cada integrante elige letra y apuesta ×1–×3 en su celular (una sola vez).':'Toca la letra de cada equipo · toca ×n para cambiar su apuesta.')+'</span></div>';
    if(rev&&o.explain)h+='<div class="expl">'+o.explain+'</div>';
    return h+strip();
  }};
}

/* ================= Contenido ================= */
/* ================= Contenido ================= */

const PERF=[
 {c:'Racional y analítico',s:'Pide datos, compara opciones, pregunta por costos y garantías.',t:'Venta consultiva',k:'Correo con documento adjunto'},
 {c:'Emocional y rápido',s:'Decide por gusto, reacciona a la imagen, compra por impulso.',t:'AIDA',k:'Redes sociales, mensaje corto'},

add({id:'cover',blk:'Portada',t:'0–2',title:'Portada',
notes:'<b>0–2 min.</b> Pide que se junten por equipo. Con <b>👥 Equipos</b> (tecla E) nombra, agrega o quita equipos (40 alumnos ≈ 8 equipos de 5). Enciende 📡 En vivo (tecla L) y proyecta el QR: cada alumno escribe nombre y apellido y elige su equipo. Reglas del día: se suman puntos por acertar, el repaso final es la Arena de ventas con apuestas y robo. La parte expositiva dura ~20 min; el resto es trabajo de equipo sobre el entregable.',

+'<div class="eyebrow">Emprendimiento y Liderazgo de Equipos · Unidad 2 · Sesión 8</div><h1 style="font-size:100px;max-width:1300px">Proceso y técnicas de <span>venta</span></h1>'

+cardT('🤝','Atención al cliente','<p>La actitud correcta frente a quien nos compra.</p>')
+cardT('🛡️','Crisis y objeciones','<p>Cómo <b>manejar</b> un problema o un “no” sin perder la relación.</p>')+'</div>'
+'<div class="callout or" style="font-size:42px">Hoy pasamos de <b>tener un proyecto</b> a <b>saber venderlo</b>: aplicamos el proceso de venta completo.</div>'

add({id:'obj',blk:'Objetivo',t:'4–5',title:'Objetivo de la clase',
notes:'<b>4–5 min.</b> Lee el objetivo y la ruta del día. Producto de hoy: embudo con metas por etapa + guion de prospección (se trabajan en clase, se pasan en limpio para la entrega). Fuente: Descriptiva S8 §2.',
html:function(){return '<h2>🎯 <em>Objetivo</em> de la clase</h2><div class="grid" style="grid-template-columns:1.1fr .9fr;gap:28px;margin-top:6px">'
+'<div><div class="card" style="font-size:36px;line-height:1.3">Que <b>apliques las etapas del proceso de venta</b>, <b>elijas la técnica adecuada</b> para tu cliente y <b>diseñes el embudo</b> de tu proyecto con metas por etapa y un <b>guion de prospección</b>.</div>'
+'<div class="callout mint" style="font-size:32px">Hoy te llevas: <b>embudo con números</b> + <b>guion probado en voz alta</b>.</div></div>'
+'<div class="tl">'+['01|Proceso, no casualidad','02|La técnica correcta','03|Números que diagnostican'].map(function(x){const a=x.split('|');return '<div class="st" style="grid-template-columns:90px 1fr"><span class="num" style="margin:0">'+a[0]+'</span><p style="font-size:34px"><b>'+a[1]+'</b></p></div>';}).join('')+'</div></div>'
+'<p class="sm" style="margin-top:22px">Ruta: Etapas → Técnicas → Embudo → Aplicación a tu proyecto → Guion</p>';}});

add({id:'detona',blk:'Activación',t:'5–8',title:'¿Por qué meses vs. minutos?',
notes:'<b>5–8 min.</b> Pregunta detonadora: “Una venta entre empresas puede tardar meses; una compra en redes se decide en minutos. ¿Por qué?” Deja que propongan (varias personas deciden, presupuestos, riesgo, compra emocional) y anota en el pizarrón. Vuelve a sus respuestas al presentar las técnicas. Cifras: preséntalas como <b>órdenes de magnitud</b> (la fuente original no está citada).',
html:function(){return '<h2>⏳ ¿Por qué <em>meses</em> en una venta y <em>minutos</em> en otra?</h2><div class="grid g2" style="margin-top:6px">'
+'<div class="card" style="border-color:var(--cy)"><span class="tag2" style="background:var(--cy);color:#06222b">B2B · venta a empresas</span><p style="font-size:58px;font-weight:800;margin:8px 0">≈ 10 meses</p><p>Varias personas deciden, hay presupuestos que aprobar y el riesgo es alto. Suele ganar <b>quien responde primero</b>.</p></div>'
+'<div class="card" style="border-color:var(--or)"><span class="tag2">B2C · compra en línea</span><p style="font-size:58px;font-weight:800;margin:8px 0">2–3 días</p><p>Decisión individual y más emocional: <b>75 %</b> se decide en las primeras 24 h. En redes, a veces <b>minutos</b>.</p></div></div>'
+'<div class="callout or" style="font-size:38px">💭 ¿Qué explica la diferencia? → No hay <b>una sola forma correcta de vender</b>: hay una forma correcta <b>para cada situación</b>.</div>'
+'<div class="row" style="margin-top:14px"><button class="btn" style="font-size:24px;padding:10px 22px" data-act="rand">🎲 Equipo al azar</button></div>';}});

add({id:'proceso',blk:'Contenido',t:'8–13',title:'Proceso de venta y sus 5 etapas',
notes:'<b>8–13 min.</b> Un proceso de venta es la secuencia estructurada de pasos desde identificar al cliente hasta cerrar y mantener la relación; permite predecir, medir y mejorar. Recorre las 5 etapas con el error típico de cada una. Cierra pidiendo que cada equipo anote en cuál cree que su proyecto está más débil (lo usan en la Actividad 1). Fuente: Descriptiva §5.1–5.2.',
html:function(){return '<h2>🧭 ¿Qué es un <em>proceso de venta</em>?</h2>'
+'<p style="font-size:32px;max-width:1700px;line-height:1.25">Una <b>secuencia de pasos</b> desde identificar a un cliente hasta cerrar y mantener la relación. No son conversaciones sueltas: es un camino con etapas que permite <b class="hl">predecir, medir y mejorar</b>.</p>'
+'<table class="tb"><tr><th style="width:360px">Etapa</th><th>En qué consiste</th><th style="width:560px">⚠ Error típico</th></tr>'
+[['1 · Prospección','Identificar quién podría necesitar tu producto. Sin esto no hay a quién venderle.','Tratar a “todos” como prospecto: se vuelve spam'],
 ['2 · Generación y calificación de leads','Un <b>lead</b> es un prospecto que ya respondió, mostró interés y puede pagar o decidir. No todo contacto es un lead.','Gastar la semana en un curioso que nunca iba a pagar'],
 ['3 · Seguimiento ⭐','La etapa más subestimada: muchos leads nunca reciben un segundo contacto.','No dar seguimiento y perder el valor ya generado'],
 ['4 · Cierre','Formalizar el acuerdo: de prospecto a cliente.','Nunca pedir la venta de forma explícita'],
 ['5 · Postventa','Retener y generar referidos: volver a vender cuesta mucho menos que un cliente nuevo.','Desaparecer después de cobrar']].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="warn">'+r[2]+'</td></tr>';}).join('')+'</table>'
+'<div class="callout or" style="margin-top:6px;font-size:30px">✍️ Marquen en equipo: <b>¿en qué etapa está más débil su proyecto?</b></div>';}});

add({id:'consultiva',blk:'Contenido',t:'13–16',title:'Venta consultiva',
notes:'<b>13–16 min.</b> El vendedor es asesor, no despachador: diagnostica primero, propone después. Diferencia clave: en la venta tradicional se habla primero del producto; en la consultiva se pregunta primero y se recomienda después. Funciona en ventas complejas y de ciclo largo (B2B); peor en compras rápidas. Origen: Mack Hanan (1970). Vuelve a las respuestas de la pregunta detonadora.',
html:function(){return '<h2>🧑‍⚕️ <em>Venta consultiva</em>: el vendedor como asesor</h2><div class="grid g3" style="margin-top:6px">'
+cardT('🔎','Diagnostica primero','<p>Entiende necesidades, problemas y objetivos reales del cliente y <b>solo después</b> propone.</p><p class="sm" style="margin-top:10px">Tradicional: habla primero del producto.<br><b>Consultiva: pregunta primero, recomienda después.</b></p>')
+cardT('✅','Características','<p>• <b>Escucha más</b> de lo que habla<br>• Resuelve un <b>problema</b>, no coloca un producto<br>• Relación de <b>largo plazo</b><br>• Propuesta <b>personalizada</b></p>')
+cardT('🎯','¿Cuándo funciona?','<p><b style="color:var(--mint)">Mejor:</b> ventas complejas, ciclo largo y alto valor (típico B2B).</p><p style="margin-top:12px"><b style="color:var(--pk)">Peor:</b> compras rápidas y de bajo involucramiento.</p>')+'</div>'
+'<p class="sm" style="margin-top:20px">Método formalizado por Mack Hanan (1970).</p>';}});

add({id:'spin',blk:'Contenido',t:'16–19',title:'SPIN Selling: 4 preguntas',
notes:'<b>16–19 min.</b> SPIN (Neil Rackham, análisis de +35,000 llamadas): cuatro tipos de pregunta, siempre en este orden, para que el cliente mismo articule por qué necesita una solución. Funciona mejor en ventas consultivas, complejas, B2B.',
html:function(){return '<h2>❓ <em>SPIN Selling</em>: 4 preguntas, siempre en orden</h2><div class="grid g4" style="margin-top:6px">'
+[['S','Situación','Entender el contexto: qué tiene, cómo opera.','¿Cómo manejan actualmente este proceso?'],
  ['P','Problema','Explorar dificultades y puntos de dolor.','¿Qué dificultades han tenido con eso?'],
  ['I','Implicación','Amplificar las consecuencias si no se resuelve.','¿Cómo afecta eso a sus tiempos de entrega o ventas?'],
  ['N','Necesidad de solución','Que el cliente articule el valor de resolverlo.','¿Qué significaría para el equipo si pudieran resolverlo?']].map(function(x){return '<div class="card"><span class="num">'+x[0]+'</span><h3>'+x[1]+'</h3><p style="font-size:28px">'+x[2]+'</p><p class="sm" style="margin-top:12px;font-size:26px">“'+x[3]+'”</p></div>';}).join('')+'</div>'
+'<div class="callout or" style="font-size:32px">⚠ Ninguna de las cuatro menciona el producto. <b>No presentas nada</b> hasta que el cliente dijo en voz alta que tiene un problema y que resolverlo le importa.</div>'
+'<p class="sm" style="margin-top:14px">Neil Rackham · 35,000+ llamadas de venta analizadas</p>';}});

add({id:'spin2',blk:'Contenido',t:'19–21',title:'SPIN en acción: proyecto de reciclaje',
notes:'<b>19–21 min.</b> Lee las cuatro preguntas con voz de vendedor y pide que identifiquen cuál es cuál. Observa: ninguna menciona el producto y el cliente llega solo a la conclusión. En la actividad, si en su guion aparece “nuestra app hace…” antes de la cuarta pregunta, detén el ejercicio y que empiecen de nuevo.',
html:function(){return '<h2>♻️ SPIN <em>en acción</em>: proyecto de reciclaje</h2><div class="tl" style="margin-top:6px">'
+[['S','¿Cómo manejan actualmente la separación de sus residuos reciclables en casa?'],
  ['P','¿Qué dificultades han tenido para encontrar dónde llevarlos?'],
  ['I','¿Cómo les afecta eso en su tiempo libre los fines de semana?'],
  ['N','¿Qué significaría para ustedes no tener que preocuparse nunca más por eso?']].map(function(x){return '<div class="st" style="grid-template-columns:90px 1fr"><span class="num" style="margin:0">'+x[0]+'</span><p style="font-size:38px">“'+x[1]+'”</p></div>';}).join('')+'</div>'
+'<div class="callout mint" style="font-size:34px">✅ Ninguna menciona el producto: el cliente <b>llega solo</b> a la conclusión de que necesita una solución.</div>';}});


SL.push(voteSlide({id:'spin-v',blk:'Contenido',t:'21–22',title:'Votación: tipo de pregunta SPIN',
 q:'«¿Cómo afecta eso a sus tiempos de entrega o a sus ventas?» ¿Qué tipo de pregunta SPIN es?',small:true,
 opts:['Situación','Problema','Implicación','Necesidad de solución'],correct:2,pts:1,
 explain:'<b>Implicación</b>: amplifica las consecuencias del problema si no se resuelve.',
 notes:'<b>21–22 min.</b> Pulsa <b>Iniciar 40 s</b>; cada alumno vota desde su celular (una vez) y al terminar se habilita Revelar. +1 por acierto. Si hay duda, regresa a la diapositiva de SPIN.'}));
add({id:'aida',blk:'Contenido',t:'22–24',title:'AIDA',
notes:'<b>22–24 min.</b> AIDA organiza un mensaje para llevar a la persona del primer contacto a la acción. Es el mismo esqueleto del pitch de la Sesión 4. Diferencia con SPIN: SPIN estructura una conversación con preguntas; AIDA estructura la forma de presentar un mensaje. Ideal en ventas cortas, bajo involucramiento y marketing de contenidos.',
html:function(){return '<h2>📣 <em>AIDA</em>: del primer contacto a la acción</h2><div class="grid g4" style="margin-top:6px">'
+[['A','Atención','Captura los primeros segundos: hook, dato o pregunta.'],['I','Interés','Curiosidad con algo relevante para esa persona.'],['D','Deseo','Conecta el producto con un beneficio que sí quiere.'],['A','Acción','Cierra con un llamado a la acción claro y concreto.']].map(function(x){return '<div class="card"><span class="num">'+x[0]+'</span><h3>'+x[1]+'</h3><p style="font-size:29px">'+x[2]+'</p></div>';}).join('')+'</div>'
+'<div class="grid g2" style="margin-top:22px"><div class="callout mint" style="margin:0;font-size:30px"><b>Funciona mejor:</b> ventas cortas, bajo involucramiento y marketing de contenidos.</div>'
+'<div class="callout" style="margin:0;font-size:30px"><b>vs. SPIN:</b> SPIN estructura una <b>conversación</b>; AIDA estructura un <b>mensaje</b> (el pitch de la S4, con otro nombre).</div></div>';}});

add({id:'adapta',blk:'Contenido',t:'24–27',title:'Adaptación: cliente × técnica × canal',
notes:'<b>24–27 min.</b> Regla: la técnica y el canal dependen del cliente. Rápido: ¿vende a otra empresa con ciclo largo? consultiva/SPIN. ¿Consumidor final, decisión rápida? AIDA. ¿Escéptico o técnico? SPIN en llamada uno a uno. ¿Institucional con cotización? Consultiva para diagnosticar + propuesta escrita. Esta tabla se usa en la actividad de equipo.',
html:function(){return '<h2>🧩 <em>A la medida</em>: cliente → técnica → canal</h2>'
+'<table class="tb"><tr><th style="width:380px">Tipo de cliente</th><th>Cómo lo reconoces</th><th style="width:300px">Técnica</th><th style="width:420px">Canal</th></tr>'
+PERF.map(function(r){return '<tr><td><b>'+r.c+'</b></td><td>'+r.s+'</td><td class="hl"><b>'+r.t+'</b></td><td>'+r.k+'</td></tr>';}).join('')+'</table>'
+'<div class="callout or" style="font-size:32px">Regla rápida: <b>B2B, ciclo largo, varios decisores → consultiva/SPIN</b> · <b>consumidor final, decisión rápida → AIDA</b>.</div>';}});

SL.push(voteSlide({id:'adapta-v',blk:'Contenido',t:'27–28',title:'Votación: comité y cotización',
 q:'Un cliente pide cotización formal y menciona que debe consultarlo con su comité. ¿Qué haces?',small:true,
 opts:['AIDA con un mensaje corto por redes sociales','Consultiva para diagnosticar + propuesta escrita para el comité','Cierre directo en la primera llamada','SPIN solo por mensaje de WhatsApp'],correct:1,pts:1,
 explain:'Cliente <b>institucional</b>: consultiva para diagnosticar y <b>propuesta escrita</b> para el comité (reunión + propuesta).',
 notes:'<b>27–28 min.</b> Pulsa <b>Iniciar 40 s</b>; cada alumno vota desde su celular y al terminar se habilita Revelar. +1 por acierto por integrante. Comprueba que distinguen cliente institucional de emocional.'}));

add({id:'cierre-v',blk:'Contenido',t:'28–30',title:'Cerrar y postventa',
notes:'<b>28–30 min.</b> Cerrar es pedir la venta; ninguna técnica consiste en esperar a que el cliente la pida. Señales de que está listo: pregunta por precio, plazos o garantía sin que se lo ofrezcas; habla en “nosotros”; pide detalles de entrega (la más clara). Postventa: tres acciones que sí se pueden hacer esta semana. Fuente: Descriptiva §5.8. Se practica en el role-play.',
html:function(){return '<h2>🤝 <em>Cerrar</em> la venta y cuidar la <em>postventa</em></h2>'
+'<div class="grid" style="grid-template-columns:1.3fr .7fr;gap:24px;margin-top:0"><div>'
+'<table class="tb" style="margin-top:-6px"><tr><th style="width:250px">Técnica de cierre</th><th>Ejemplo</th></tr>'
+[['Directo','«¿Lo dejamos apartado para el viernes?»'],['Por alternativa','«¿Lo prefieres de medio litro o de litro?»'],['Por resumen','«Quedamos en que te ahorra dos horas y elimina el error: ¿empezamos el lunes?»'],['Condicional','«Si te consigo la entrega el jueves, ¿cerramos hoy?»']].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td style="font-size:27px">'+r[1]+'</td></tr>';}).join('')+'</table>'
+'<div class="callout or" style="font-size:30px;margin-top:6px">Cerrar es <b>pedir la venta</b>: ninguna técnica consiste en esperar a que el cliente la pida.</div></div>'
+'<div><div class="card" style="padding:20px 24px"><h3>🚦 Señales de “listo”</h3><p style="font-size:26px">Pregunta por precio, plazos o garantía · habla en “nosotros” · pide detalles de entrega.</p></div>'
+'<div class="card" style="padding:20px 24px;margin-top:14px"><h3>💌 Postventa esta semana</h3><p style="font-size:26px">1. Confirmación en 24 h<br>2. Pregunta de satisfacción a los 7 días<br>3. Petición de referido (después del “sí”)</p></div></div></div>';}});
add({id:'embudo',blk:'Contenido',t:'30–32',title:'El embudo de ventas',
notes:'<b>30–32 min.</b> El embudo es la representación numérica del camino del cliente. Se llama embudo porque en cada etapa se pierde gente. Las etapas son las mismas del proceso. No es un dibujo bonito: es una herramienta de diagnóstico. Lee el contraste “nos va mal” vs “el problema está en el cierre”.',
html:function(){return '<h2>🔻 El <em>embudo</em> de ventas</h2><div class="grid" style="grid-template-columns:1fr 1fr;gap:34px;margin-top:6px"><div class="fun">'
+[['Prospectos contactados','100%'],['Leads calificados','↓'],['Propuestas o demos','↓'],['Cierres (clientes)','↓']].map(function(x,i){return '<div class="fs" style="width:'+(100-i*17)+'%;opacity:'+(1-i*.12)+'"><b>'+x[0]+'</b></div>';}).join('')
+'<div class="fs post"><b>+ Postventa y referidos</b></div></div>'
+'<div><p style="font-size:30px">En cada etapa <b>se pierde gente</b>: entran muchos arriba y solo una fracción cierra.</p>'
+'<div class="card" style="margin-top:10px"><h3>📖 Prospecto vs. lead</h3><p style="font-size:26px"><b>Prospecto:</b> podría necesitarte y ya lo contactaste.<br><b>Lead:</b> respondió, mostró interés y puede pagar o decidir.</p></div>'
+'<div class="card" style="margin-top:16px;border-color:var(--pk)"><h3>Sin números</h3><p style="font-size:30px">“No nos están comprando.”</p></div>'
+'<div class="card" style="margin-top:14px;border-color:var(--mint)"><h3>Con números</h3><p style="font-size:30px">“De 10 contactados, 4 escuchan, 2 piden precio y ninguna cierra: <b>el problema está en el cierre</b>, no en la promoción.”</p></div></div></div>';}});

add({id:'metricas',blk:'Contenido',t:'32–33',title:'Las 3 métricas del embudo',
notes:'<b>32–33 min.</b> Tres métricas: conversión por etapa (etapa siguiente ÷ etapa anterior × 100), ticket promedio (ingreso total ÷ clientes cerrados) y tiempo de ciclo (días entre primer contacto y cierre, promediados). Sin medirlas se vende a ciegas.',
html:function(){return '<h2>📏 <em>Mide</em>: 3 métricas básicas</h2><div class="grid g3" style="margin-top:10px">'
+cardT('📉','Conversión por etapa','<p>Qué % avanza de una etapa a la siguiente.</p><div class="formula">etapa siguiente ÷ etapa anterior × 100</div>')
+cardT('💵','Ticket promedio','<p>Cuánto genera en promedio cada cliente que cierra.</p><div class="formula">ingreso total ÷ clientes cerrados</div>')
+cardT('⏱️','Tiempo de ciclo','<p>Cuánto tarda un prospecto en volverse cliente.</p><div class="formula">días entre 1.er contacto y cierre (promedio)</div>')+'</div>'
+'<div class="callout or">Sin medirlos, estás <b>vendiendo a ciegas</b>.</div>';}});

add({id:'ejemplo',blk:'Contenido',t:'33–35',title:'Ejemplo resuelto: diagnóstico',
notes:'<b>33–35 min.</b> Proyecta antes de la Actividad 1. Dos lecturas: en <b>volumen</b>, la mayor fuga es prospectos→leads (60 personas) = problema de prospección/perfil; en <b>porcentaje</b>, la conversión más baja es el cierre (25 %) = oferta, precio o técnica de cierre. El cuello de botella es el cierre porque llegar a la propuesta ya costó trabajo. Pregunta final: “si solo mejoran una etapa la próxima semana, ¿cuál?” Subir cierre de 25 % a 40 % = 3 clientes más sin contactar a nadie nuevo.',
html:function(){return '<h2>🔬 Ejemplo: <em>diagnostica</em> este embudo</h2><div class="grid" style="grid-template-columns:1.05fr .95fr;gap:30px">'
+'<div><table class="tb"><tr><th>Etapa</th><th>Cantidad</th><th>Conversión</th><th>Se pierden</th></tr>'
+[['Prospectos contactados','100','—','—'],['Leads calificados','40','40 %','60'],['Propuestas o demos','20','50 %','20'],['Cierres (clientes)','5','<b class="hl">25 %</b>','15']].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';}).join('')+'</table>'
+'<p class="sm">Ticket promedio <b>$350</b> · Ingreso <b>$1,750</b> · Ciclo <b>18 días</b></p></div>'
+'<div><div class="card" style="border-color:var(--cy);padding:22px 28px"><h3>📦 En volumen</h3><p style="font-size:28px">Mayor fuga: prospectos → leads (60). Apunta a un <b>perfil mal definido</b> (prospección).</p></div>'
+'<div class="card" style="border-color:var(--or);margin-top:16px;padding:22px 28px"><h3>📊 En porcentaje</h3><p style="font-size:28px">Conversión más baja: <b>cierre, 25 %</b>. Apunta a oferta, precio o técnica de cierre → <b class="hl">cuello de botella</b>.</p></div></div></div>'
+'<div class="callout mint" style="font-size:30px">💡 Si solo mejoran <b>una</b> etapa: subir el cierre de 25 % a 40 % da <b>3 clientes más</b> sin contactar a nadie nuevo.</div>';}});

SL.push(clueSlide({id:'g-clue',blk:'Arena',t:'35–37',round:'ARENA · RONDA 1 · BUZZER',title:'¿Qué es? 🕵️',

/* ================= Render ================= */
function applyRv(){
  const s=SL[S.idx],n=S.rvn[s.id]||0;
  sl.querySelectorAll('.rv').forEach((el,i)=>{if(i<n)el.classList.add('on');});
}
function markAsked(s){if(!liveOn())return;if(s.vote||s.bet||s.clue)S.asked[s.id]=1;}
function render(){
  const s=SL[S.idx];
  cv.classList.toggle('game',!!s.game);
  sl.innerHTML='<div class="top"><span class="kick">'+s.blk+'</span><span class="tm">⏱ min '+s.t+'</span></div>'+s.html(s);
  applyRv();
  markAsked(s);
  $('#ct').textContent=(S.idx+1)+' / '+SL.length;
  $('#prog').style.width=((S.idx+1)/SL.length*100)+'%';
  if($('#notes').style.display==='block')showNotes();
  if($('#score').style.display==='block')renderScore();
  save();
  liveSync();
}
function go(i){S.idx=Math.max(0,Math.min(SL.length-1,i));render();}
function next(){
  const hid=sl.querySelector('.rv:not(.on)');
  if(hid){hid.classList.add('on');const sid=SL[S.idx].id;S.rvn[sid]=(S.rvn[sid]||0)+1;save();return;}
  go(S.idx+1);
}
function prev(){go(S.idx-1);}

/* ================= Acciones de diapositiva ================= */
function revealVote(sid){
  const sd=SL.find(x=>x.id===sid),o=sd.vote,v=S.votes[sid]||{};let any=false;
  S.teams.forEach(function(t){
    const ms=members(sid,t.id);
    if(ms.length){ms.forEach(function(m){
      const ok=(o.correct!=null&&m.i===o.correct);S.dv[sid][m.dev].ok=(o.correct!=null)?ok:null;
      const p=o.ptsByOpt?o.ptsByOpt[m.i]:(ok?o.pts:0);if(p){addLog(t.id,p,'vote',sid,m.dev);any=true;}});}
    else{const i=v[t.id];if(i===undefined)return;
      const p=o.ptsByOpt?o.ptsByOpt[i]:(i===o.correct?o.pts:0);if(p){addLog(t.id,p,'vote',sid);any=true;}}
  });
  if(o.correct!=null){sfx(any?'ok':'no');if(any)burst();}
}
function revealBet(sid){
  const o=SL.find(x=>x.id===sid).bet,v=S.votes[sid]||{},bt=S.bets[sid]||{};let any=false;
  S.teams.forEach(function(t){
    const ms=members(sid,t.id);
    if(ms.length){
      ms.forEach(function(m){const ok=m.i===o.correct;S.dv[sid][m.dev].ok=ok;if(ok){addLog(t.id,m.b||1,'bet',sid,m.dev);any=true;}});
      ms.forEach(function(m){if(m.i!==o.correct){const loss=Math.min(m.b||1,Math.max(0,pts(t.id)));if(loss>0)addLog(t.id,-loss,'bet',sid,m.dev);}});
    }else{const i=v[t.id];if(i===undefined)return;const bb=bt[t.id]||1;
      if(i===o.correct){addLog(t.id,bb,'bet',sid);any=true;}
      else{const loss=Math.min(bb,Math.max(0,pts(t.id)));if(loss>0)addLog(t.id,-loss,'bet',sid);}}
  });
  sfx(any?'ok':'no');if(any)burst();
}
function unreveal(sid,why){
  delete S.rev[sid];S.log=S.log.filter(l=>!(l.sid===sid&&l.why===why));
  Object.keys(S.dv[sid]||{}).forEach(k=>{S.dv[sid][k].ok=null;});
}
const ACT={
  cyc:function(b){
    const sid=b.dataset.sid,id=+b.dataset.team;if(S.rev[sid])return;
    const sd=SL.find(x=>x.id===sid);const n=sd.vote.opts.length;
    const v=S.votes[sid]||(S.votes[sid]={});
    const cur=(v[id]===undefined)?-1:v[id];const nx=cur+1>=n?-1:cur+1;
    if(nx<0)delete v[id];else v[id]=nx;
    render();
  },
  reveal:function(b){const sid=b.dataset.sid;if(!S.rev[sid]){S.rev[sid]=true;revealVote(sid);}else unreveal(sid,'vote');render();},
  flip:function(b){b.classList.toggle('f');},
  teams:function(){openTeams();},
  rand:function(){randTeam();},
  timer:function(b){const s=+b.dataset.sec;if(!s){stopTimer();return;}startTimer(s);},
  xlsx:function(){downloadXlsx();},
  qStart:function(b){const sid=b.dataset.sid;S.qt[sid]={end:Date.now()+QSEC*1000,done:false};sfx('start');render();},
  qSkip:function(b){const t=S.qt[b.dataset.sid];if(t){t.done=true;t.end=Date.now();}render();},
  live:function(){toggleLive();},
  cStart:function(b){const c=cs(b.dataset.sid);Object.assign(c,{st:'run',n:1,el:0,t0:Date.now(),buzz:null,bd:null,locked:[],w:null});sfx('start');render();},
  cBuzz:function(b){const c=cs(b.dataset.sid);if(c.st!=='run')return;const id=+b.dataset.team;if(c.locked.indexOf(id)>-1)return;c.el=(Date.now()-c.t0)/1000;c.st='buzz';c.buzz=id;c.bd=b.dataset.dev||null;
    if(c.bd){(S.dv[b.dataset.sid]||(S.dv[b.dataset.sid]={}))[c.bd]={tm:id,i:null,k:'z',ts:Date.now(),ok:null,b:null};}
    sfx('buzz');render();},
  cOk:function(b){const sid=b.dataset.sid,c=cs(sid),id=c.buzz;addLog(id,[3,2,1][c.n-1],'pista',sid,c.bd);if(c.bd&&S.dv[sid]&&S.dv[sid][c.bd])S.dv[sid][c.bd].ok=true;c.w=id;c.st='done';sfx('ok');burst();render();},
  cNo:function(b){const sid=b.dataset.sid,c=cs(sid),id=c.buzz;if(pts(id)>0)addLog(id,-1,'pista',sid,c.bd);if(c.bd&&S.dv[sid]&&S.dv[sid][c.bd])S.dv[sid][c.bd].ok=false;c.locked.push(id);c.buzz=null;c.bd=null;c.st='run';c.t0=Date.now()-c.el*1000;sfx('no');render();},
  cReset:function(b){const sid=b.dataset.sid;S.log=S.log.filter(l=>!(l.sid===sid&&l.why==='pista'));delete S.clue[sid];delete S.dv[sid];render();},
  bcell:function(b){const sid=b.dataset.sid,id=+b.dataset.team,i=+b.dataset.i;const v=S.votes[sid]||(S.votes[sid]={});if(v[id]===i)delete v[id];else v[id]=i;render();},
  bbet:function(b){const sid=b.dataset.sid,id=+b.dataset.team;const bt=S.bets[sid]||(S.bets[sid]={});bt[id]=((bt[id]||1)%3)+1;render();},
  bReveal:function(b){const sid=b.dataset.sid;if(!S.rev[sid]){S.rev[sid]=true;revealBet(sid);}else unreveal(sid,'bet');render();},
  pickT:function(b){S.steal.t=+b.dataset.team;if(S.steal.v==S.steal.t)S.steal.v=null;render();},
  pickV:function(b){S.steal.v=+b.dataset.team;render();},
  amt:function(b){S.steal.n=+b.dataset.n;render();},
  cc:function(){S.cc=[PERF[Math.floor(Math.random()*PERF.length)].c,CANALES[Math.floor(Math.random()*CANALES.length)]];sfx('tick');render();},
  stealAsk:function(){const st=S.steal;if(!st.t||!st.v)return;let pool=STEAL_Q.map((_,i)=>i).filter(i=>st.used.indexOf(i)<0);if(!pool.length){st.used=[];pool=STEAL_Q.map((_,i)=>i);}
    st.q=pool[Math.floor(Math.random()*pool.length)];st.used.push(st.q);st.res=null;st.show=false;st.last='';
    st.sid='robo#'+(++S.stealN);delete S.qt[st.sid];S.dv[st.sid]={};S.qmeta[st.sid]={title:'Robo: '+STEAL_Q[st.q].q,kind:'Robo'};if(liveOn())S.asked[st.sid]=1;render();},
  stealShow:function(){
    const st=S.steal,q=STEAL_Q[st.q];st.show=true;
    const ms=members(st.sid,st.t);
    if(ms.length){
      ms.forEach(m=>{S.dv[st.sid][m.dev].ok=(m.i===q.c);});
      const cnt={};ms.forEach(m=>{cnt[m.i]=(cnt[m.i]||0)+1;});
      const mx=Math.max.apply(null,Object.values(cnt)),top=Object.keys(cnt).filter(k=>cnt[k]===mx);
      const win=(top.length===1)?+top[0]:-1;
      if(!st.res)stealApply(win===q.c?'ok':'no');else render();
    }else render();
  },
  stealOk:function(){stealApply('ok');},
  stealNo:function(){stealApply('no');},
  stealFlip:function(){const st=S.steal;S.log=S.log.filter(l=>!(l.why==='robo'&&l.id>st.mark));stealApply(st.res==='ok'?'no':'ok');},
  stealNew:function(){const st=S.steal;S.steal={t:null,v:null,n:1,q:null,res:null,show:false,used:st.used,last:st.last,sid:null};render();}
};
function stealApply(r){
  const st=S.steal;if(!st.t||!st.v||st.q==null)return;
  st.mark=S.seq;const a=team(st.t),v=team(st.v);let k;

function MQ(url,opt){
  opt=opt||{};
  var enc=new TextEncoder(),dec=new TextDecoder();
  var ws=null,buf=new Uint8Array(0),pid=0,pingT=null,rcT=null,subs=[],up=false,closed=false,wait=1500;
  var cid=opt.cid||('c'+Math.random().toString(36).slice(2,10));
  function cat(a,b){var r=new Uint8Array(a.length+b.length);r.set(a,0);r.set(b,a.length);return r;}
  function s2b(s){var b=enc.encode(s),r=new Uint8Array(b.length+2);r[0]=b.length>>8;r[1]=b.length&255;r.set(b,2);return r;}
  function rl(n){var a=[];do{var d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d);}while(n>0);return new Uint8Array(a);}
  function pkt(h,body){var l=rl(body.length),r=new Uint8Array(1+l.length+body.length);r[0]=h;r.set(l,1);r.set(body,1+l.length);return r;}
  function send(p){try{if(ws&&ws.readyState===1)ws.send(p);}catch(e){}}
  function emit(s){if(opt.onState)opt.onState(s,api);}
  function connect(){
    if(closed)return;
    var me;
    try{me=ws=new WebSocket(url,'mqtt');}catch(e){retry();return;}
    ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    ws.onopen=function(){send(pkt(0x10,cat(cat(s2b('MQTT'),new Uint8Array([4,2,0,30])),s2b(cid))));};
    ws.onmessage=function(ev){buf=cat(buf,new Uint8Array(ev.data));parse();};
    ws.onclose=function(){if(me!==ws)return;var was=up;up=false;clearInterval(pingT);if(was)emit('down');else emit('fail');retry();};
    ws.onerror=function(){};
  }
  function retry(){if(closed)return;clearTimeout(rcT);rcT=setTimeout(connect,wait);wait=Math.min(wait*1.6,10000);}
  function parse(){
    while(buf.length>=2){
      var i=1,m=1,len=0,b;
      do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128;}while(b&128);
      if(buf.length<i+len)return;
      var h=buf[0],body=buf.subarray(i,i+len);buf=buf.subarray(i+len);
      var t=h>>4;
      if(t===2){
        if(body[1]===0){up=true;wait=1500;subs.forEach(dosub);clearInterval(pingT);pingT=setInterval(function(){send(new Uint8Array([0xC0,0]));},15000);emit('up');}
        else emit('refused');
      }else if(t===3){
        var tl=(body[0]<<8)|body[1],topic=dec.decode(body.subarray(2,2+tl)),o=2+tl;
        if(((h>>1)&3)>0)o+=2;
        if(opt.onMsg)opt.onMsg(topic,dec.decode(body.subarray(o)));
      }
    }
  }
  function dosub(t){pid=(pid%65535)+1;send(pkt(0x82,cat(new Uint8Array([pid>>8,pid&255]),cat(s2b(t),new Uint8Array([0])))));}
  var api={
    sub:function(t){if(subs.indexOf(t)<0)subs.push(t);if(up)dosub(t);},
    pub:function(t,p,retain){if(!up)return false;send(pkt(0x30|(retain?1:0),cat(s2b(t),enc.encode(p))));return true;},
    close:function(){closed=true;clearInterval(pingT);clearTimeout(rcT);try{ws.close();}catch(e){}},
    isUp:function(){return up;},url:url
  };
  connect();return api;
}

const LV={on:false,cl:[],pres:{},seq:0,last:'',hb:null,deb:null};
function plain(h){const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<br\s*\/?>/gi,' ');return d.textContent.replace(/\s+/g,' ').trim();}
function liveState(){
  const s=SL[S.idx],o={r:ROOM,sid:s.id,k:'i',ti:plain(s.title),teams:S.teams.map(t=>({id:t.id,n:t.name,c:col(t)})),sc:{},ad:[]};
  S.teams.forEach(t=>{o.sc[t.id]=pts(t.id);});
  const q=s.vote||s.bet;
  if(q){
    o.k=s.bet?'b':'v';o.q=plain(q.q);o.cs=plain(q.case||'');o.o=q.opts.map(plain);o.l=q.labels||null;
    o.rev=!!S.rev[s.id];if(o.rev&&q.correct!=null)o.c=q.correct;o.ad=Object.keys(dvOf(s.id));o.qs=qStatus(s.id).st;o.left=Math.round(qStatus(s.id).left);
  }else if(s.clue){
    const c=S.clue[s.id]||{st:'idle',n:1,locked:[]};
    o.k='z';o.st=c.st;o.n=c.n||1;o.lk=c.locked||[];o.bz=c.buzz||null;o.w=c.w==null?null:c.w;o.ad=c.bd?[c.bd]:[];
  }else if(s.id==='robo'&&S.steal.q!=null){
    const st=S.steal,q=STEAL_Q[st.q];
    o.k='r';o.sid=st.sid;o.q=q.q;o.o=q.o;o.rt=st.t;o.rv=st.v;o.rev=!!st.show;if(st.show)o.c=q.c;o.ad=Object.keys(dvOf(st.sid));o.qs=qStatus(st.sid).st;o.left=Math.round(qStatus(st.sid).left);
  }
  return o;
}

function onUp(txt){
  let m;try{m=JSON.parse(txt);}catch(e){return;}
  if(!m||m.r!==ROOM||!m.d||typeof m.d!=='string'||m.d.length>24)return;
  const nm=String(m.nm||'').trim().slice(0,30),ap=String(m.ap||'').trim().slice(0,30);
  if(m.tm!=null&&team(m.tm)&&nm&&ap){
    LV.pres[m.d]={tm:m.tm,ts:Date.now()};
    const pp=S.people[m.d];
    if(!pp)S.people[m.d]={nombre:nm,apellido:ap,tm:m.tm,first:Date.now()};
    else{pp.nombre=nm;pp.apellido=ap;pp.tm=m.tm;}
  }else return;
  if(m.t==='p'){liveBtn();if($('#live').style.display==='block')liveDraw();clearTimeout(LV.sv);LV.sv=setTimeout(save,1500);return;}
  const s=slid();if(!s)return;
  if(m.t==='v'){
    const q=s.vote||s.bet;let sid,n;
    if(q){sid=s.id;if(S.rev[sid]||qStatus(sid).st!=='run')return;n=q.opts.length;}
    else if(s.id==='robo'&&S.steal.q!=null&&m.sid===S.steal.sid){
      sid=S.steal.sid;if(S.steal.show||m.tm!==S.steal.t||qStatus(sid).st!=='run')return;n=STEAL_Q[S.steal.q].o.length;
    }else return;
    if(m.sid!==sid)return;
    if(!(m.i>=0&&m.i<n))return;
    const d=S.dv[sid]||(S.dv[sid]={});
    if(d[m.d]){livePub(true);return;}                       /* una sola respuesta por dispositivo: gana la primera */
    d[m.d]={tm:m.tm,i:m.i|0,b:s.bet?Math.min(3,Math.max(1,m.b|0||1)):null,ts:Date.now(),k:s.bet?'b':(q?'v':'r'),ok:null};
    if(q&&liveOn())S.asked[sid]=1;
    save();clearTimeout(LV.deb);LV.deb=setTimeout(function(){render();livePub(true);},150);
  }else if(m.t==='z'&&s.clue){
    const c=cs(s.id);if(c.st!=='run'||c.locked.indexOf(+m.tm)>-1)return;
    ACT.cBuzz({dataset:{sid:s.id,team:+m.tm,dev:m.d}});
  }
}
function liveStart(){
  if(LV.on)return;LV.on=true;S.live=true;save();
  BROKERS.forEach(function(u){
    const c=MQ(u,{cid:'h'+Math.random().toString(36).slice(2,9),
      onMsg:function(tp,tx){if(tp===TOP+'/up')onUp(tx);},
      onState:function(st,api){if(st==='up'){api.sub(TOP+'/up');LV.last='';livePub(true);}liveBtn();if($('#live').style.display==='block')liveDraw();}});

  LV.hb=setInterval(function(){livePub(true);liveBtn();},15000);

}

const CRCT=(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(function(f){
    const n=enc.encode(f.n),d=enc.encode(f.d),crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x5821,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,n.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),n,d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x5821,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),n);
    off+=30+n.length+d.length;
  });
  let cs=0;cen.forEach(a=>{cs+=a.length;});
  const en=new DataView(new ArrayBuffer(22));en.setUint32(0,0x06054b50,true);en.setUint16(8,files.length,true);en.setUint16(10,files.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);
  const all=parts.concat(cen,[new Uint8Array(en.buffer)]);let tot=0;all.forEach(a=>{tot+=a.length;});
  const out=new Uint8Array(tot);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return out;
}
function xe(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');}
function colL(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}

  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>'+widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols><sheetData>';
  rows.forEach(function(r,ri){

function buildSheets(){
  const asked=Object.keys(S.asked).length;

  const stat={};devs.forEach(d=>{stat[d]={r:0,a:0,p:0};});
  const detail=[['Diapositiva / pregunta','Tipo','Nombre','Apellido','Equipo','Letra elegida','Correcta','Apuesta','Puntos']];
  Object.keys(S.dv).forEach(function(sid){
    const d=S.dv[sid],o=((SL.find(x=>x.id===sid)||{}).vote||(SL.find(x=>x.id===sid)||{}).bet);
    Object.keys(d).forEach(function(dev){

      if(!stat[dev])stat[dev]={r:0,a:0,p:0};

      detail.push([qTitle(sid),qKind(sid),pp.nombre,pp.apellido,pname(e.tm),e.i==null?'—':'ABCDEF'[e.i],e.ok===true?'Sí':(e.ok===false?'No':'—'),e.b||'',pt]);
    });
  });
  const per=[['Nombre','Apellido','Equipo','Preguntas respondidas','Aciertos','Puntos aportados al equipo','% de participación']];
  devs.sort((a,b)=>{const A=S.people[a],B=S.people[b];return (pname(A.tm)).localeCompare(pname(B.tm))||A.apellido.localeCompare(B.apellido);}).forEach(function(dev){

  ranking.forEach(function(x,i){

    eq.push([x.t.name,devs.filter(d=>S.people[d].tm==x.t.id).length,resp,ac,x.p,i+1]);
  });
  return [{n:'Por persona',r:per,w:[18,20,16,22,12,26,20]},{n:'Por equipo',r:eq,w:[18,24,14,12,16,12]},{n:'Detalle',r:detail,w:[46,12,18,20,16,14,12,10,10]}];
}

const T={left:0,total:0,end:0,run:false,iv:null};

function beep(){
  try{const A=window.AudioContext||window.webkitAudioContext;const a=new A();
    [0,.28,.56].forEach(function(d){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=d<.5?880:1175;g.gain.setValueAtTime(.0001,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.4,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.25);o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.26);});
  }catch(e){}
}

function startTimer(sec){stopTimer(true);T.total=sec;T.left=sec;T.end=Date.now()+sec*1000;T.run=true;$('#timer').classList.remove('end');$('#timer').style.display='flex';drawT();
  T.iv=setInterval(function(){T.left=(T.end-Date.now())/1000;if(T.left<=0){T.left=0;T.run=false;clearInterval(T.iv);drawT();$('#timer').classList.add('end');beep();}else drawT();},200);}

  if(k==='reset'){stopTimer(true);T.left=T.total;T.end=Date.now()+T.left*1000;$('#timer').classList.remove('end');drawT();}

render();
