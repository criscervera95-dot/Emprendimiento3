<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emprendimiento · Sesión 10 · Registro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#FD6B18;color:#fff;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.35);font-size:13px;background:rgba(0,0,0,.12)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffd2b3;margin-right:6px}.dot.ok{background:#7dffc4}.dot.bad{background:#7a0f0f}
main{flex:1;padding:18px 14px 28px;max-width:560px;width:100%;margin:0 auto}
h1{font-size:24px;line-height:1.2;margin-bottom:8px}
.sub{color:rgba(255,255,255,.92);font-size:16px;line-height:1.4;margin-bottom:14px}
.kick{display:inline-block;background:#111;color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:10px;padding:5px 12px;margin-bottom:12px}
input.in{width:100%;background:#fff;border:3px solid transparent;border-radius:14px;color:#111;padding:14px;font:600 17px/1.2 inherit;margin-bottom:10px}
input.in:focus{outline:0;border-color:#111}
.go{display:block;text-align:center;width:100%;background:#111;color:#fff;border:0;border-radius:16px;padding:16px;font:800 18px/1.2 inherit;margin-top:6px;cursor:pointer}
.err{font-size:14px;min-height:18px;margin-bottom:6px;font-weight:700}
.wait{text-align:center;padding:36px 10px}.wait .big{font-size:56px;margin-bottom:10px}
.ring{width:42px;height:42px;border:5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.team{background:#fff;color:#111;border-radius:22px;border-top:14px solid var(--c);padding:18px 18px 14px;margin:12px 0;box-shadow:0 10px 26px rgba(110,40,0,.3)}
.team h2{font-size:32px;line-height:1.1;margin-bottom:4px}.team p{font-size:15px;color:#555;margin-bottom:10px}
.team li{list-style:none;font-size:18px;font-weight:600;padding:6px 0;border-top:1px solid #eee}
.team li.me{color:var(--c);font-weight:800}
.team li.ld{background:#fff4d1;border-radius:8px;padding:6px 10px;border-top:0;margin:2px 0}
.lbanner{background:linear-gradient(135deg,#ffc233,#fd6b18);color:#111;border-radius:16px;padding:14px 16px;margin:12px 0;font-weight:800;font-size:20px;text-align:center;box-shadow:0 6px 16px rgba(253,107,24,.35)}
.link{color:#fff;text-decoration:underline;font-size:14px;cursor:pointer;display:inline-block;margin-top:14px}
footer{padding:10px 14px;text-align:center;color:rgba(255,255,255,.85);font-size:12px}
</style></head><body>
<header><span><span class="dot" id="dot"></span><span id="st">Conectando…</span></span><span id="who"></span></header>
<main id="m"></main>
<footer>Emprendimiento · Sesión 10 · solo guardamos tu nombre y apellido para formar equipos</footer>
<script>
(function(){
'use strict';
function MQ(url,opt){
  opt=opt||{};
  var enc=new TextEncoder(),dec=new TextDecoder();
  var ws=null,buf=new Uint8Array(0),pid=0,pingT=null,rcT=null,subs=[],up=false,closed=false,wait=1500;
  var cid=opt.cid||('c'+Math.random().toString(36).slice(2,10));
  function cat(a,b){var r=new Uint8Array(a.length+b.length);r.set(a,0);r.set(b,a.length);return r;}
  function s2b(s){var b=enc.encode(s),r=new Uint8Array(b.length+2);r[0]=b.length>>8;r[1]=b.length&255;r.set(b,2);return r;}
  function rl(n){var a=[];do{var d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d);}while(n>0);return new Uint8Array(a);}
  function pkt(h,body){var l=rl(body.length),r=new Uint8Array(1+l.length+body.length);r[0]=h;r.set(l,1);r.set(body,1+l.length);return r;}
  function send(p){try{if(ws&&ws.readyState===1)ws.send(p);}catch(e){}}
  function emit(s){if(opt.onState)opt.onState(s,api);}
  function connect(){
    if(closed)return;
    var me;
    try{me=ws=new WebSocket(url,'mqtt');}catch(e){retry();return;}
    ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    ws.onopen=function(){send(pkt(0x10,cat(cat(s2b('MQTT'),new Uint8Array([4,2,0,30])),s2b(cid))));};
    ws.onmessage=function(ev){buf=cat(buf,new Uint8Array(ev.data));parse();};
    ws.onclose=function(){if(me!==ws)return;var was=up;up=false;clearInterval(pingT);if(was)emit('down');else emit('fail');retry();};
    ws.onerror=function(){};
  }
  function retry(){if(closed)return;clearTimeout(rcT);rcT=setTimeout(connect,wait);wait=Math.min(wait*1.6,10000);}
  function parse(){
    while(buf.length>=2){
      var i=1,m=1,len=0,b;
      do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128;}while(b&128);
      if(buf.length<i+len)return;
      var h=buf[0],body=buf.subarray(i,i+len);buf=buf.subarray(i+len);
      var t=h>>4;
      if(t===2){
        if(body[1]===0){up=true;wait=1500;subs.forEach(dosub);clearInterval(pingT);pingT=setInterval(function(){send(new Uint8Array([0xC0,0]));},15000);emit('up');}
        else emit('refused');
      }else if(t===3){
        var tl=(body[0]<<8)|body[1],topic=dec.decode(body.subarray(2,2+tl)),o=2+tl;
        if(((h>>1)&3)>0)o+=2;
        if(opt.onMsg)opt.onMsg(topic,dec.decode(body.subarray(o)));
      }
    }
  }
  function dosub(t){pid=(pid%65535)+1;send(pkt(0x82,cat(new Uint8Array([pid>>8,pid&255]),cat(s2b(t),new Uint8Array([0])))));}
  var api={
    sub:function(t){if(subs.indexOf(t)<0)subs.push(t);if(up)dosub(t);},
    pub:function(t,p,retain){if(!up)return false;send(pkt(0x30|(retain?1:0),cat(s2b(t),enc.encode(p))));return true;},
    close:function(){closed=true;clearInterval(pingT);clearTimeout(rcT);try{ws.close();}catch(e){}},
    isUp:function(){return up;},url:url
  };
  connect();return api;
}

var P=new URLSearchParams(location.search),ROOM=P.get('r')||'';
var TOP='edt/ec3/s10/'+ROOM;
var BRK=P.get('broker')?[P.get('broker')]:['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var dev=lsGet('s10dev')||('d'+Math.random().toString(36).slice(2,10));lsSet('s10dev',dev);
var idn=null;try{idn=JSON.parse(lsGet('s10id_'+ROOM)||'null');}catch(e){}
var ST=null,cli=null,bi=0,gotState=false,swT=null,lastSeq=0,lastTs=0,err='',editing=false;
function ready(){return idn&&idn.nm&&idn.ap;}
function setStatus(){
  var up=cli&&cli.isUp(),fresh=Date.now()-lastTs<40000;
  $('#dot').className='dot '+(up?(fresh?'ok':''):'bad');
  $('#st').textContent=!up?'Conectando…':(fresh?'En vivo · profe conectada':'Conectado · esperando a la profe');
  $('#who').innerHTML=ready()?'<b>'+esc(idn.nm)+'</b>':'';
}
function presence(){if(ready()&&cli)cli.pub(TOP+'/up',JSON.stringify({t:'p',r:ROOM,d:dev,nm:idn.nm,ap:idn.ap}),false);}
function connect(){
  if(cli){try{cli.close();}catch(e){}}
  gotState=false;
  var url=BRK[bi%BRK.length];
  cli=MQ(url,{cid:'a'+dev+Math.random().toString(36).slice(2,5),
    onMsg:function(tp,tx){if(tp!==TOP+'/state')return;var o;try{o=JSON.parse(tx);}catch(e){return;}if(!o||o.r!==ROOM)return;if(o.seq<lastSeq)return;lastSeq=o.seq;lastTs=o.ts||Date.now();gotState=true;clearTimeout(swT);ST=o;draw();setStatus();},
    onState:function(s,api){
      if(s==='up'){api.sub(TOP+'/state');presence();clearTimeout(swT);swT=setTimeout(function(){if(!gotState){bi++;connect();}},6000);}
      if(s==='fail'||s==='refused'){clearTimeout(swT);swT=setTimeout(function(){bi++;connect();},2500);}
      setStatus();
    }});
}
function draw(){
  var m=$('#m');
  if(!ROOM){m.innerHTML='<div class="wait"><div class="big">🤔</div><h1>Falta el código de sala</h1><p class="sub">Escanea de nuevo el QR que está en la pantalla.</p></div>';return;}
  if(!ready()||editing){
    if($('#inm'))return;
    m.innerHTML='<div class="kick">Registro</div><h1>¿Quién eres?</h1><p class="sub">Escribe tu nombre y apellido para entrar al sorteo de equipos.</p>'
      +'<input class="in" id="inm" placeholder="Nombre" maxlength="30" autocomplete="given-name" value="'+esc(idn&&idn.nm||'')+'"><input class="in" id="iap" placeholder="Apellido" maxlength="30" autocomplete="family-name" value="'+esc(idn&&idn.ap||'')+'"><div class="err" id="err">'+esc(err)+'</div><button class="go" data-id="1">Registrarme</button>';
    return;
  }
  if(!ST){m.innerHTML='<div class="wait"><div class="ring"></div><h1>Conectando con la clase…</h1><p class="sub">Si tarda, revisa tu internet o usa datos móviles. La profesora debe tener abierta la presentación.</p></div>';return;}
  var tid=ST.asg&&ST.asg[dev],registered=(ST.ids||[]).indexOf(dev)>-1;
  if(tid!=null){
    var t=(ST.teams||[]).filter(function(x){return x.id===tid;})[0];
    if(t){
      var mine=(idn.nm+' '+idn.ap.charAt(0)+'.').trim();
      m.innerHTML='<div class="kick">Sorteo realizado</div><h1>¡Ya tienes equipo!</h1><div class="team" style="--c:'+esc(t.c)+'"><h2>'+esc(t.n)+'</h2><p>Busca a tus compañeros y siéntense juntos.</p><ul>'
        +(t.m||[]).map(function(n,i){return '<li class="'+(n===mine?'me':'')+(i===t.li?' ld':'')+'">'+(i===t.li?'👑 ':'')+esc(n)+(n===mine?' (tú)':'')+(i===t.li?' · LÍDER':'')+'</li>';}).join('')+'</ul></div>'
        +((t.m||[])[t.li]===mine&&t.li>-1?'<div class="lbanner">👑 ¡Te tocó ser el líder de tu equipo!</div>':'')
        +'<p class="sub">El líder se sortea. Los demás roles no se asignan: tu equipo los descubrirá durante la misión.</p>';
      return;
    }
  }
  if(registered){
    m.innerHTML='<div class="wait"><div class="big">✅</div><h1>¡Registrado, '+esc(idn.nm)+'!</h1><p class="sub">Ya estás en el sorteo. Mira la pantalla del salón: tu equipo aparecerá aquí en cuanto la profesora lo sortee.</p><p class="sub"><b>'+(ST.n||0)+'</b> alumnos registrados</p><a class="link" data-ch="1">Cambiar mi nombre</a></div>';
    return;
  }
  if(!ST.open){
    m.innerHTML='<div class="wait"><div class="big">🔒</div><h1>El registro está cerrado</h1><p class="sub">Avísale a tu profesora para que te agregue al sorteo.</p><a class="link" data-ch="1">Cambiar mi nombre</a></div>';return;
  }
  m.innerHTML='<div class="wait"><div class="ring"></div><h1>Enviando tu registro…</h1><p class="sub">Un momento, '+esc(idn.nm)+'.</p></div>';
}
$('#m').addEventListener('click',function(e){
  if(e.target.closest('[data-id]')){
    var n=($('#inm').value||'').trim(),a=($('#iap').value||'').trim();
    if(!n||!a){$('#err').textContent='Escribe nombre y apellido.';return;}
    err='';idn={nm:n.slice(0,30),ap:a.slice(0,30)};lsSet('s10id_'+ROOM,JSON.stringify(idn));editing=false;draw();presence();setStatus();return;}
  if(e.target.closest('[data-ch]')){editing=true;draw();}
});
setInterval(function(){presence();setStatus();},4000);
draw();setStatus();
if(ROOM)connect();
})();
</script></body></html>
