<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sesión 10 · Liderazgo en acción — Presentación de clase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141a; --card:#222733; --card2:#2b3140; --ink:#f6f7fb; --mut:#a9b0c3;
  --or:#FD6B18; --am:#ffc233; --mint:#2ee6a6; --pk:#ff4f8b; --cy:#3dd6f5; --vi:#a78bfa; --red:#ff5d5d; --blue:#1a3a6b;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a0b02;color:var(--ink);font-family:var(--font);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#FD6B18}
#cv::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 2px,transparent 2px);background-size:44px 44px;pointer-events:none}
#sl{position:absolute;inset:0;padding:60px 96px 70px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.kick{font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#111;padding:6px 20px;border-radius:10px}
.tm{font-size:24px;color:#fff;background:rgba(0,0,0,.2);padding:6px 18px;border-radius:99px}
h1{font-size:140px;line-height:1.02;font-weight:800;letter-spacing:-.03em;color:#fff}
h2{font-size:66px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:22px;color:#fff}
h2 em,h1 span{font-style:normal;color:#111}
h3{font-size:36px;font-weight:700;margin-bottom:8px;color:#111}
p,li{font-size:36px;line-height:1.3;color:#fff}
.sm{font-size:27px}
.grid{display:grid;gap:24px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;color:#1a1a1a;border-radius:26px;padding:28px 32px;box-shadow:0 10px 28px rgba(110,40,0,.28);position:relative}
.card p,.card li{color:#2b2b2b;font-size:30px}
.card b{color:#111}
.card .ic{font-size:64px;line-height:1;margin-bottom:10px;display:block}
.card .sm{color:#555}
.num{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#111;color:#fff;font-weight:800;font-size:30px;margin-bottom:10px}
.lab{display:inline-block;background:#111;color:#fff;padding:0 22px 4px;border-radius:12px;transform:rotate(-2deg);margin:0 4px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.callout{background:#fff;color:#111;border-left:12px solid #111;border-radius:18px;padding:20px 30px;font-size:32px;margin-top:22px;box-shadow:0 8px 22px rgba(110,40,0,.25)}
.callout.dk{background:#111;color:#fff;border-left-color:#fff}
.callout b{color:inherit}
.btn{background:#111;color:#fff;font-weight:700;font-size:26px;padding:14px 28px;border-radius:99px;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:#fff;color:#111}
.btn.mint{background:#0e8f5f;color:#fff}
.btn.big{font-size:32px;padding:18px 40px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.chip{--c:#fff;display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--c) 16%,#fff);border:3px solid var(--c);color:#111;font-weight:700;font-size:24px;padding:5px 16px;border-radius:99px;white-space:nowrap;line-height:1.2}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block}
button.chip:hover{filter:brightness(.95)}
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.cover .eyebrow{font-size:26px;font-weight:700;letter-spacing:.1em;color:#fff;background:#111;display:inline-block;align-self:flex-start;padding:8px 20px;border-radius:10px;text-transform:uppercase;margin-bottom:18px}
.cover h1 span{background:#fff;border-radius:14px;padding:0 18px 6px;display:inline-block;transform:rotate(-1.5deg)}
.cover .sub{font-size:44px;font-weight:700;margin-top:22px;color:#fff;max-width:1200px;line-height:1.15}
.cover .cinfo{margin-top:34px}.cover .cinfo p{font-size:32px;color:#fff;line-height:1.5}.cover .cinfo b{color:#fff}
.cover .rules{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;max-width:1300px}
.cover .rules div{background:#fff;color:#111;border-radius:18px;padding:12px 22px;font-size:26px;box-shadow:0 6px 16px rgba(110,40,0,.25)}
.cover .rules div b{color:#FD6B18}
.blob{position:absolute;right:20px;top:90px;font-size:330px;transform:rotate(-8deg);filter:drop-shadow(0 20px 30px rgba(90,30,0,.4))}
.blob2{position:absolute;right:420px;bottom:90px;font-size:150px;transform:rotate(12deg);filter:drop-shadow(0 12px 20px rgba(90,30,0,.4))}
.tb{width:100%;border-collapse:separate;border-spacing:0 8px}
.tb th{font-size:22px;color:#111;text-align:left;padding:0 18px;letter-spacing:.08em;text-transform:uppercase}
.tb td{background:#fff;color:#1a1a1a;font-size:28px;line-height:1.2;padding:12px 18px;vertical-align:middle}
.tb td:first-child{border-radius:16px 0 0 16px;font-weight:800}.tb td:last-child{border-radius:0 16px 16px 0}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.mx .card{min-height:300px}
.mx h3{font-size:44px}
.tag{display:inline-block;background:#111;color:#fff;font-weight:700;font-size:24px;border-radius:99px;padding:3px 16px;margin:0 6px 8px 0}
.tag.or{background:#FD6B18}
.tl{display:flex;flex-direction:column;gap:12px}
.tl .st{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;background:#fff;border-radius:20px;padding:12px 24px;box-shadow:0 6px 16px rgba(110,40,0,.2)}
.tl .st .yr{font-size:30px;font-weight:800;color:#FD6B18}
.tl .st p{font-size:28px;color:#2b2b2b}
.rol{padding:18px 22px;min-height:0}
.rol h3{font-size:30px}.rol p{font-size:24px;line-height:1.2}.rol .ic{font-size:44px;margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.tabs .tb2{background:#fff;color:#111;border-radius:99px;padding:8px 20px 8px 8px;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px rgba(110,40,0,.2)}
.tabs .tb2 b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#111;color:#fff;font-size:24px}
.tabs .tb2.x{background:#111;color:#fff}.tabs .tb2.x b{background:#FD6B18}
.mock{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 28px rgba(110,40,0,.3);color:#222}
.mock .mh{background:linear-gradient(135deg,#1a3a6b,#2c5aa0);color:#fff;padding:14px 24px;font-weight:800;font-size:26px}
.mock .mb{padding:16px 24px}
.mock .pbar{height:14px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.mock .pbar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#1a3a6b,#e87722)}
.mock .dots{display:flex;gap:10px;margin:10px 0}
.mock .dots span{width:36px;height:36px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-weight:700;font-size:18px;color:#64748b}
.mock .dots .d{background:#1a3a6b;color:#fff}.mock .dots .a{background:#e87722;color:#fff}
.mock .btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.mock .btns span{border:2px solid #e2e8f0;border-radius:8px;padding:6px 14px;font-size:20px;font-weight:600;color:#475569}
/* juego */
#cv.game{background:radial-gradient(1100px 650px at 90% -10%,#7a2d06 0%,transparent 60%),radial-gradient(900px 600px at -5% 105%,#0b2a52 0%,transparent 60%),#0d0f1a}
#cv.game .kick{background:#FD6B18}
#cv.game h2,#cv.game p{color:#fff}
.gtitle{font-size:60px;font-weight:800;line-height:1.08;margin:4px 0 14px;color:#fff}
.gtitle em{font-style:normal;color:#FD6B18}
.gcard{background:#222733;border-radius:26px;padding:26px 30px;border:2px solid rgba(255,255,255,.07)}
.gcard h3{color:#fff;font-size:32px}.gcard p{font-size:28px;color:#dfe3ef}
.turn{font-size:54px;font-weight:800;margin:6px 0}
.cnt{display:flex;align-items:center;gap:14px;font-size:30px;margin:6px 0}
.cnt b{font-size:56px;min-width:70px;text-align:center;color:#ffc233}
.cnt button{background:#2b3140;width:56px;height:56px;border-radius:14px;font-size:34px;font-weight:800}
.cnt button:hover{background:#3b4358}
.strip{position:absolute;left:96px;right:96px;bottom:62px;display:flex;gap:10px}
.sc{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:6px 12px 10px;border-left:6px solid var(--c);position:relative;overflow:hidden}
.sc .n{font-size:18px;color:#cfd4e6;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-size:34px;line-height:1.05;display:block}
.sc small{font-size:16px;color:#aab}
.sc.cur{outline:3px solid #ffc233}
.sc.done{opacity:.75}
.pod{display:flex;gap:26px;align-items:flex-end;justify-content:center;height:430px;margin-top:10px}
.pod .col{width:380px;text-align:center}
.pod .blk{border-radius:24px 24px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:16px;font-size:80px;font-weight:800;color:#111}
.pod .nm{font-size:38px;font-weight:700;margin-bottom:6px}
.pod .pt{font-size:30px;color:#ffc233;font-weight:700;margin-bottom:6px}
.pop{position:absolute;font-size:60px;pointer-events:none;z-index:40;animation:pp 1.6s ease-out forwards}
@keyframes pp{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}
/* UI flotante */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(14,16,22,.92);border:1px solid rgba(255,255,255,.14);padding:6px 10px;border-radius:99px;z-index:50;opacity:.55;transition:.2s}
#bar:hover{opacity:1}
#bar button{background:transparent;font-size:15px;font-weight:600;padding:8px 12px;border-radius:99px;color:#e9ecf6;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar .ct{font-size:15px;color:#aab;padding:0 8px;min-width:64px;text-align:center}
#prog{position:fixed;left:0;top:0;height:4px;background:#FD6B18;z-index:60;transition:.3s}
.panel{position:fixed;z-index:70;background:#171a23;border:1px solid rgba(255,255,255,.16);border-radius:20px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6);display:none}
.panel h4{font-size:20px;margin-bottom:10px}
#modal{top:50%;left:50%;transform:translate(-50%,-50%);width:640px;max-height:84vh;overflow:auto;padding:24px}
.tr{display:grid;grid-template-columns:24px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px}
.tr input{background:#0f1118;border:1px solid #3a4152;border-radius:10px;color:#fff;padding:8px 12px;font:600 16px var(--font);width:100%}
.tr .dot{width:22px;height:22px;border-radius:50%}
.mini{background:#2a3040;font-size:14px;font-weight:700;padding:6px 12px;border-radius:8px;color:#fff}
.mini:hover{background:#3b4358}
#goto{top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;max-width:94vw;max-height:86vh;overflow:auto;padding:22px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.gg button{background:#222733;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.25;color:#fff}
.gg button small{display:block;color:#ffc233;font-weight:600;font-size:12px;margin-bottom:2px}
.gg button.cur{outline:2px solid #FD6B18}
.gg button:hover{background:#31384a}
#notes{left:50%;bottom:62px;transform:translateX(-50%);width:min(1100px,92vw);padding:18px 24px;font-size:17px;line-height:1.5;max-height:46vh;overflow:auto}
#notes b{color:#ffc233}
#notes ul{margin:6px 0 0 20px}#notes li{font-size:17px;color:#fff;line-height:1.45}
#timer{top:14px;left:14px;padding:10px 16px;align-items:center;gap:12px}
#timer .tt{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;min-width:150px}
#timer.end{background:#6b1414;animation:fl .5s 6}
@keyframes fl{50%{background:#a82020}}
#timer button{background:#2a3040;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px;color:#fff}
#rand{inset:0;border-radius:0;place-items:center;background:rgba(6,7,10,.9)}
#rand .box{text-align:center}
#rand .big{font-size:110px;font-weight:800;margin:20px 0;min-width:900px}
#rand .st{font-size:28px;color:#a9b0c3}
.help{font-size:13px;color:#8d96ab;margin-top:12px;line-height:1.6}
kbd{background:#2a3040;border-radius:6px;padding:1px 7px;font-size:12px}
.qrc{background:#fff;border-radius:22px;padding:14px;width:290px;text-align:center;color:#111;box-shadow:0 14px 40px rgba(0,0,0,.45);flex:none}
.qrc svg{width:100%;height:auto;display:block}.qrc b{display:block;font-size:24px;margin-top:6px;color:#111}.qrc span{font-size:16px;color:#444;line-height:1.2;display:block}
.tcard{background:#222733;border-radius:18px;padding:12px 16px;border-top:8px solid var(--c);min-width:0}
.tcard .th{font-size:28px;font-weight:800;color:#fff;margin-bottom:6px}.tcard .th small{font-size:18px;color:#a9b0c3;font-weight:600}
.tcard .tn{font-size:20px;line-height:1.3;color:#dfe3ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcount{font-size:84px;font-weight:800;color:#ffc233;line-height:1}
#live{inset:0;border-radius:0;background:rgba(6,7,10,.96);padding:40px 60px;overflow:auto}
#live .lw{display:flex;gap:50px;align-items:flex-start;justify-content:center}
#live .lq{width:520px;background:#fff;border-radius:28px;padding:18px;flex:none}#live .lq svg{width:100%;height:auto;display:block}
#live .li{flex:1;max-width:800px}#live h4{font-size:34px;margin-bottom:8px}
#live .lbig{font-size:46px;font-weight:800;line-height:1.1;margin:6px 0 10px;color:#fff}
#live .lurl{font-size:14px;color:#a9b0c3;word-break:break-all}
#live .lst{font-size:20px;margin:12px 0}
#lvList{display:flex;flex-wrap:wrap;gap:8px;max-height:260px;overflow:auto;margin:10px 0}
#lvList span{background:#222733;border-radius:99px;padding:5px 8px 5px 14px;font-size:16px;display:inline-flex;gap:8px;align-items:center}
#lvList span button{background:#3b4358;border-radius:50%;width:22px;height:22px;font-size:12px;color:#fff}
#live input{background:#0f1118;border:1px solid #3a4152;border-radius:10px;color:#fff;padding:9px 12px;font:600 16px var(--font);width:300px}
#bar button.liveon{background:#0f3a2c;color:#2ee6a6}
@media print{#bar,.panel,#prog{display:none!important}}
</style>
</head>

<div id="stage"><div id="cv"><div id="sl"></div></div></div>

<div id="bar">
  <button data-b="prev" title="Anterior (←)">◀</button>
  <span class="ct" id="ct">1 / 1</span>
  <button data-b="next" title="Siguiente (→ / espacio)">▶</button>
  <button data-b="goto" title="Ir a… (G)">☰ Ir a</button>
  <button data-b="teams" title="Equipos (E)">👥 Equipos</button>

<script>
(function(){
'use strict';
/* ================= Estado ================= */
var KEY='s10_liderazgo_pico_v1';
var COLORS=['#FD6B18','#1a73e8','#ffc233','#e91e8c','#0e8f5f','#7c4dff','#d32f2f','#00acc1'];
function defTeams(n){var a=[];for(var i=1;i<=n;i++)a.push({id:i,name:'Equipo '+i,c:(i-1)%COLORS.length});return a;}
function fresh(){return {teams:defTeams(5),idx:0,order:[],cur:0,board:{},nid:100,people:{},members:{},asg:{},size:8,open:true};}
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||!S.teams){S=fresh();}
S.board=S.board||{};S.order=S.order||[];S.people=S.people||{};S.members=S.members||{};S.asg=S.asg||{};S.size=S.size||8;if(S.open===undefined)S.open=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(typeof LV!=='undefined'&&LV.cl&&LV.cl.length)liveSoon();}
var $=function(s){return document.querySelector(s);};
var sl=$('#sl'),cv=$('#cv');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function team(id){return S.teams.find(function(t){return t.id==id;});}
function col(t){return COLORS[t.c%COLORS.length];}
function bd(id){return S.board[id]||(S.board[id]={lv:0,ps:0});}
function score(id){var b=bd(id);return b.lv*2+b.ps;}
function chipS(t){return '<span class="chip" style="--c:'+col(t)+'"><i></i>'+esc(t.name)+'</span>';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function ranking(){return S.teams.slice().sort(function(a,b){return score(b.id)-score(a.id);});}

/* ---------- Sonidos / confeti ---------- */
var AC=null;
function tone(f,d,at,type,vol){try{var A=window.AudioContext||window.webkitAudioContext;if(!AC)AC=new A();var o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;var t0=AC.currentTime+(at||0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}catch(e){}}
function sfx(k){
  if(k==='ok'){[523,659,784,1047].forEach(function(f,i){tone(f,.18,i*.09);});}
  else if(k==='no'){tone(180,.35,0,'sawtooth',.2);tone(140,.4,.12,'sawtooth',.2);}
  else if(k==='start'){[392,523,659].forEach(function(f,i){tone(f,.14,i*.12);});}
  else if(k==='dice'){tone(300+Math.random()*300,.05,0,'square',.1);}
  else if(k==='win'){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.25,i*.1);});}
}
function burst(em){var arr=em||['🎉','⭐','✨','🎮','🧩'];for(var i=0;i<26;i++){var s=document.createElement('span');s.className='pop';s.textContent=arr[i%arr.length];s.style.left=(200+Math.random()*1500)+'px';s.style.top=(300+Math.random()*400)+'px';s.style.setProperty('--dx',(Math.random()*400-200)+'px');s.style.setProperty('--dy',(-200-Math.random()*300)+'px');cv.appendChild(s);(function(n){setTimeout(function(){n.remove();},1700);})(s);}}

/* ================= Diapositivas ================= */
var SL=[];
function add(o){SL.push(o);}
function lab(t){return '<span class="lab">'+t+'</span>';}
function card(ic,name,html,cls){return '<div class="card'+(cls?' '+cls:'')+'">'+(ic?'<span class="ic">'+ic+'</span>':'')+'<h3>'+name+'</h3>'+html+'</div>';}
function strip(){
  var cur=S.order[S.cur];
  return '<div class="strip">'+S.teams.map(function(t){
    var b=bd(t.id),i=S.order.indexOf(t.id);
    return '<div class="sc'+(t.id==cur?' cur':'')+(i>-1&&i<S.cur?' done':'')+'" style="--c:'+col(t)+'"><span class="n">'+esc(t.name)+(i>-1?' · turno '+(i+1):'')+'</span><b>'+score(t.id)+'</b><small>'+b.lv+' niveles · '+b.ps+' pit stops</small></div>';
  }).join('')+'</div>';
}

/* 1 · PORTADA */
add({id:'cover',blk:'1 · Portada',t:'0–2',title:'Portada',
notes:'<b>Minuto 0–2.</b><ul><li>Da la bienvenida y menciona que hoy la sesión se juega: habrá Game Room.</li><li>Datos de portada visibles: curso, unidad, tema, fecha y profesora.</li><li>Alumnos: se sientan por equipos de hasta 8; todavía no se sortea nada.</li></ul>',
html:function(){return '<div class="cover"><div class="blob">🧭</div><div class="blob2">🤝</div>'
 +'<div class="eyebrow">Sesión 10 · Unidad 3 · Liderazgo y equipos de alto desempeño</div>'
 +'<h1>Liderazgo<br><span>en acción</span></h1>'
 +'<div class="sub">Liderazgo situacional y trabajo en equipo</div>'
 +'<div class="cinfo"><p><b>Emprendimiento · 3er semestre</b> · Universidad Anáhuac Mayab</p><p>Profesora: <b>Cris Cervera</b> · Viernes 30 de octubre de 2026</p></div></div>';}});

/* 2 · RECAP */
add({id:'recap',blk:'2 · Recap clase anterior',t:'2–4',title:'¿Qué vimos la sesión pasada?',
notes:'<b>Minuto 2–4.</b><ul><li>Sesión 9: canales de venta digitales del proyecto (dónde y cómo vender).</li><li>Puente: ya definimos hacia afuera cómo vender. Hoy miramos hacia adentro: cómo se lidera a cada persona del equipo.</li><li>Pregunta rápida al grupo (30 s): «¿Qué canal de venta eligió su equipo?». Solo para reactivar.</li></ul>',
html:function(){return '<h2>¿Qué vimos la <em>sesión pasada</em>?</h2><p style="margin-bottom:22px">Sesión 9 · Ventas: canales de venta digitales.</p>'
 +'<div class="grid g2">'
 +card('🌐','Canales de venta digitales','<p>Elegimos dónde vender el proyecto y por qué ese canal.</p>')
 +card('🧭','Hoy miramos adentro','<p>Cómo funciona el equipo con cada persona: estilo de liderazgo, conflicto y decisión.</p>')
 +'</div><div class="callout dk">Ya sabemos <b>dónde vender</b>. ¿Sabemos <b>por qué el equipo funciona distinto con cada persona</b>?</div>';}});

/* 3 · DETONADORA */
add({id:'detona',blk:'2 · Recap clase anterior',t:'4–6',title:'Pregunta detonadora: ¿a todos los tratas igual?',
notes:'<b>Minuto 4–6.</b><ul><li>Proyecta la pregunta. Deja que 2 o 3 alumnos respondan: la mayoría dirá que sí, con orgullo.</li><li>Suelta la vuelta de tuerca: «¿le explicarías igual una tarea a quien la hace por primera vez que a quien lleva tres meses?».</li><li>Frase para dejar escrita en el pizarrón y retomar al cierre: <b>tratar a todos igual no es equidad, es comodidad del líder.</b></li></ul>',
html:function(){return '<h2>Piensa en tu equipo…</h2><div style="font-size:92px;font-weight:800;line-height:1.05;color:#fff;margin:10px 0 26px">¿A todos los <span class="lab">tratas igual</span>?</div>'
 +'<div class="grid g2"><div class="card"><span class="ic">🆕</span><h3>Alguien que hace la tarea por primera vez</h3><p>¿Le explicas igual?</p></div><div class="card"><span class="ic">🛠️</span><h3>Alguien que lleva tres meses haciéndola</h3><p>¿Le explicas igual?</p></div></div>'
 +'<div class="callout dk">Tratar a todos igual no es equidad: es <b>comodidad del líder</b>.</div>';}});

/* 4 · OBJETIVO */
add({id:'obj',blk:'3 · Objetivo y actividad',t:'6–8',title:'Objetivo de la sesión y actividad',
notes:'<b>Minuto 6–8.</b><ul><li>Lee el objetivo en voz alta: verbo + alumno + qué + cómo.</li><li>Explica en una frase la actividad: «hoy aprenden el modelo en 12 minutos y lo usan en vivo jugando».</li><li>Menciona los tres productos: misión en Game Room, hoja de observación y acuerdos del equipo.</li></ul>',
html:function(){return '<h2>Objetivo de la <em>sesión</em></h2>'
 +'<div class="card" style="padding:30px 38px"><p style="font-size:36px;line-height:1.3"><b>Aplicar</b>, el alumno, el <b>liderazgo situacional de Hersey-Blanchard</b>, diagnosticando la madurez de sus compañeros y ajustando su estilo de dirección, al <b>superar en equipo una misión cooperativa en vivo</b> y documentar los acuerdos de conflicto y decisión de su equipo.</p></div>'
 +'<h2 style="margin-top:26px;font-size:54px">Actividad de hoy</h2>'
 +'<div class="grid g3">'
 +card('🎮','Misión en Game Room','<p>Sorpresa: cada equipo juega su turno con 8 controles. Los demás observan.</p>')
 +card('📋','Hoja de observación','<p>Los equipos que esperan analizan estilo, conflicto y decisión del equipo que juega.</p>')
 +card('🤝','Acuerdos del equipo','<p>Seis acuerdos de conflicto y decisión para entregar el 1 de noviembre.</p>')
 +'</div>';}});

/* 5 · HB idea */
add({id:'hb1',blk:'4 · Desarrollo del tema',t:'8–10',title:'No existe un estilo de liderazgo universal',
notes:'<b>Minuto 8–10 (2 min).</b><ul><li>Hersey y Blanchard presentan el modelo en 1969 (teoría del ciclo de vida del liderazgo), después rebautizado liderazgo situacional.</li><li>Idea central: ajustar el estilo a la madurez del equipo y a la tarea concreta.</li><li>Aclara: no son cuatro personalidades de líder; son cuatro dosis distintas de las mismas dos conductas.</li></ul>',
html:function(){return '<h2>No existe un estilo de liderazgo <span class="lab">universal</span></h2><p style="margin-bottom:20px">Modelo de liderazgo situacional · Hersey y Blanchard (1969).</p>'
 +'<div class="grid g2">'
 +card('📌','Conducta de tarea','<p>Cuánto dirige, instruye y supervisa. Se ocupa del <b>qué, cómo y cuándo</b>.</p>')
 +card('💬','Conducta de relación','<p>Cuánto escucha, apoya y motiva. Se ocupa de la <b>confianza y el compromiso</b>.</p>')
 +'</div><div class="callout">El líder eficaz <b>diagnostica</b> la madurez de cada persona frente a cada tarea y <b>ajusta</b> su estilo. Dirigir a alguien competente lo frustra; delegarle a alguien que empieza lo abandona.</div>';}});

/* 6 · Madurez */
add({id:'mad',blk:'4 · Desarrollo del tema',t:'10–13',title:'Los cuatro niveles de madurez (M1–M4)',
notes:'<b>Minuto 10–13 (3 min).</b><ul><li>Madurez = capacidad (saber hacer) + disposición (querer y sentirse seguro). Cambia con cada tarea.</li><li>Pregunta que separa M2 de M3: «¿lo hizo mal por no saber o por no querer?».</li><li>Pídeles ubicar mentalmente a un compañero en una tarea del proyecto.</li></ul>',
html:function(){return '<h2>Madurez = <em>capacidad</em> + <em>disposición</em></h2>'
 +'<table class="tb"><tr><th>Nivel</th><th>Capacidad</th><th>Disposición</th><th>Cómo se ve</th><th>Necesita</th></tr>'
 +'<tr><td>M1</td><td>Baja</td><td>Baja</td><td>No sabe y no se anima.</td><td>Instrucciones claras y seguimiento cercano.</td></tr>'
 +'<tr><td>M2</td><td>Baja</td><td>Alta</td><td>No sabe, pero quiere.</td><td>Dirección y motivación a la vez.</td></tr>'
 +'<tr><td>M3</td><td>Alta</td><td>Baja</td><td>Sabe, pero duda.</td><td>Apoyo y participación en las decisiones.</td></tr>'
 +'<tr><td>M4</td><td>Alta</td><td>Alta</td><td>Sabe y quiere.</td><td>Autonomía y seguimiento a resultados.</td></tr></table>'
 +'<div class="callout dk">Pregunta clave: <b>¿lo hizo mal por no saber o por no querer?</b></div>';}});

/* 7 · Estilos */
add({id:'est',blk:'4 · Desarrollo del tema',t:'13–16',title:'Los cuatro estilos: dirigir, persuadir, participar, delegar',
notes:'<b>Minuto 13–16 (3 min).</b><ul><li>Cada nivel de madurez tiene su estilo: M1→S1, M2→S2, M3→S3, M4→S4.</li><li>Ejemplo rápido del proyecto: alguien nuevo en diseño (M1) necesita S1; alguien experto en finanzas que perdió confianza (M3) necesita S3.</li><li>Anuncia: hoy lo usarán en vivo, en el «pit stop de liderazgo».</li></ul>',
html:function(){return '<h2>Cada madurez pide un <em>estilo</em></h2>'
 +'<div class="mx">'
 +card('','S1 · Dirigir <span class="tag or">M1</span>','<p><b>Tarea alta · relación baja.</b> Instruye paso a paso y supervisa de cerca.</p>')
 +card('','S2 · Persuadir <span class="tag or">M2</span>','<p><b>Tarea alta · relación alta.</b> Explica el porqué, dirige y motiva.</p>')
 +card('','S3 · Participar <span class="tag or">M3</span>','<p><b>Tarea baja · relación alta.</b> Escucha, apoya y decide junto con la persona.</p>')
 +card('','S4 · Delegar <span class="tag or">M4</span>','<p><b>Tarea baja · relación baja.</b> Da autonomía y revisa resultados.</p>')
 +'</div>';}});

/* 8 · Tres inteligencias */
add({id:'intel',blk:'4 · Desarrollo del tema',t:'16–18',title:'Las tres inteligencias del líder emprendedor',
notes:'<b>Minuto 16–18 (2 min).</b><ul><li>Contextual: leer el entorno. Relacional: gestionar relaciones y resolver conflictos. En la acción: ejecutar bajo incertidumbre.</li><li>Conecta con la misión de hoy: leer el reto (contextual), comunicarse (relacional), intentar de nuevo sin parálisis (acción).</li></ul>',
html:function(){return '<h2>Tres <em>inteligencias</em> del líder emprendedor</h2>'
 +'<div class="grid g3">'
 +card('🔭','01 · Contextual','<p>Lee el entorno: mercado, competencia y momento. <b>En la misión:</b> lee el reto antes de moverse.</p>')
 +card('🤝','02 · Relacional','<p>Gestiona relaciones y resuelve conflictos. <b>En la misión:</b> comunica y cuida al equipo.</p>')
 +card('⚡','03 · En la acción','<p>Ejecuta bajo incertidumbre: prueba, ajusta y reintenta. <b>En la misión:</b> falla, aprende y vuelve a intentar.</p>')
 +'</div><div class="callout">Las tres se entrenan con práctica. Hoy el equipo es el laboratorio.</div>';}});

/* 9 · Conflicto y decisión */
add({id:'conf',blk:'4 · Desarrollo del tema',t:'18–20',title:'Conflicto y decisión colectiva',
notes:'<b>Minuto 18–20 (2 min).</b><ul><li>Conflicto de tarea suma; conflicto de relación resta.</li><li>Regla de oro: el equipo declara en voz alta su método de decisión antes de discutir.</li><li>Tres métodos: consenso; consulta y decide el responsable; votación con regla de desempate.</li><li>Último dato antes de la dinámica: en Pico Park habrá que decidir la ruta bajo presión.</li></ul>',
html:function(){return '<h2>Conflicto y <em>decisión</em> en equipo</h2>'

/* ================= EN VIVO: registro de alumnos (MQTT sobre WebSocket) ================= */
var ROOM='a3f81c5d',TOP='edt/ec3/s10/'+ROOM,BASE='https://criscervera95-dot.github.io/Emprendimiento3/sesion-10/',ALUMNO=BASE+'alumno.html?r='+ROOM;
var QP=new URLSearchParams(location.search);
var BROKERS=QP.get('broker')?[QP.get('broker')]:['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
var LV={cl:[],last:'',hb:null,deb:null};
function MQ(url,opt){
  opt=opt||{};
  var enc=new TextEncoder(),dec=new TextDecoder();
  var ws=null,buf=new Uint8Array(0),pid=0,pingT=null,rcT=null,subs=[],up=false,closed=false,wait=1500;
  var cid=opt.cid||('c'+Math.random().toString(36).slice(2,10));
  function cat(a,b){var r=new Uint8Array(a.length+b.length);r.set(a,0);r.set(b,a.length);return r;}
  function s2b(s){var b=enc.encode(s),r=new Uint8Array(b.length+2);r[0]=b.length>>8;r[1]=b.length&255;r.set(b,2);return r;}
  function rl(n){var a=[];do{var d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d);}while(n>0);return new Uint8Array(a);}
  function pkt(h,body){var l=rl(body.length),r=new Uint8Array(1+l.length+body.length);r[0]=h;r.set(l,1);r.set(body,1+l.length);return r;}
  function send(p){try{if(ws&&ws.readyState===1)ws.send(p);}catch(e){}}
  function emit(s){if(opt.onState)opt.onState(s,api);}
  function connect(){
    if(closed)return;
    var me;
    try{me=ws=new WebSocket(url,'mqtt');}catch(e){retry();return;}
    ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    ws.onopen=function(){send(pkt(0x10,cat(cat(s2b('MQTT'),new Uint8Array([4,2,0,30])),s2b(cid))));};
    ws.onmessage=function(ev){buf=cat(buf,new Uint8Array(ev.data));parse();};
    ws.onclose=function(){if(me!==ws)return;var was=up;up=false;clearInterval(pingT);if(was)emit('down');else emit('fail');retry();};
    ws.onerror=function(){};
  }
  function retry(){if(closed)return;clearTimeout(rcT);rcT=setTimeout(connect,wait);wait=Math.min(wait*1.6,10000);}
  function parse(){
    while(buf.length>=2){
      var i=1,m=1,len=0,b;
      do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128;}while(b&128);
      if(buf.length<i+len)return;
      var h=buf[0],body=buf.subarray(i,i+len);buf=buf.subarray(i+len);
      var t=h>>4;
      if(t===2){
        if(body[1]===0){up=true;wait=1500;subs.forEach(dosub);clearInterval(pingT);pingT=setInterval(function(){send(new Uint8Array([0xC0,0]));},15000);emit('up');}
        else emit('refused');
      }else if(t===3){
        var tl=(body[0]<<8)|body[1],topic=dec.decode(body.subarray(2,2+tl)),o=2+tl;
        if(((h>>1)&3)>0)o+=2;
        if(opt.onMsg)opt.onMsg(topic,dec.decode(body.subarray(o)));
      }
    }
  }
  function dosub(t){pid=(pid%65535)+1;send(pkt(0x82,cat(new Uint8Array([pid>>8,pid&255]),cat(s2b(t),new Uint8Array([0])))));}
  var api={
    sub:function(t){if(subs.indexOf(t)<0)subs.push(t);if(up)dosub(t);},
    pub:function(t,p,retain){if(!up)return false;send(pkt(0x30|(retain?1:0),cat(s2b(t),enc.encode(p))));return true;},
    close:function(){closed=true;clearInterval(pingT);clearTimeout(rcT);try{ws.close();}catch(e){}},
    isUp:function(){return up;},url:url
  };
  connect();return api;
}
function shortName(d){var p=S.people[d];return p?(p.nm+' '+(p.ap||'').charAt(0)+'.').trim():'';}
function liveState(){
  var o={r:ROOM,seq:Date.now(),ts:Date.now(),k:'reg',open:!!S.open,size:S.size,n:Object.keys(S.people).length,ids:Object.keys(S.people),teams:[],asg:{}};
  S.teams.forEach(function(t){o.teams.push({id:t.id,n:t.name,c:col(t),m:(S.members[t.id]||[]).map(shortName)});});
  Object.keys(S.asg).forEach(function(d){o.asg[d]=S.asg[d];});
  return o;
}
function livePub(force){
  var tx=JSON.stringify(liveState()),core=tx.replace(/"seq":\d+,"ts":\d+,/,'');
  if(!force&&core===LV.last)return;LV.last=core;
  LV.cl.forEach(function(c){if(c.isUp())c.pub(TOP+'/state',tx,true);});
}
function liveSoon(){clearTimeout(LV.deb);LV.deb=setTimeout(function(){livePub(false);},250);}
function onUp(tx){
  var m;try{m=JSON.parse(tx);}catch(e){return;}
  if(!m||m.r!==ROOM||m.t!=='p'||typeof m.d!=='string'||m.d.length>24)return;
  var nm=String(m.nm||'').trim().slice(0,30),ap=String(m.ap||'').trim().slice(0,30);if(!nm)return;
  var p=S.people[m.d];
  if(!p){if(!S.open)return;S.people[m.d]={nm:nm,ap:ap,ts:Date.now()};save();livePub(true);liveBtn();if($('#live').style.display==='block')liveDraw();if(SL[S.idx].id==='sorteo')render();return;}
  if(p.nm!==nm||p.ap!==ap){if(S.open){p.nm=nm;p.ap=ap;save();liveDraw();if(SL[S.idx].id==='sorteo')render();}}
}
function liveStart(){
  BROKERS.forEach(function(u){
    var c=MQ(u,{cid:'h'+Math.random().toString(36).slice(2,9),
      onMsg:function(tp,tx){if(tp===TOP+'/up')onUp(tx);},
      onState:function(st,api){if(st==='up'){api.sub(TOP+'/up');LV.last='';livePub(true);}liveBtn();if($('#live').style.display==='block')liveDraw();}});
    LV.cl.push(c);
  });
  LV.hb=setInterval(function(){livePub(true);liveBtn();},15000);
}
function liveBtn(){var up=LV.cl.filter(function(c){return c.isUp();}).length,b=$('#bLive');if(!b)return;b.textContent='📡 Registro · '+Object.keys(S.people).length;b.className=up?'liveon':'';}
function liveDraw(){
  var up=LV.cl.filter(function(c){return c.isUp();}).length,ks=Object.keys(S.people);
  $('#lvUrl').textContent=ALUMNO;
  $('#lvSt').innerHTML='Servidores conectados: <b>'+up+'/'+LV.cl.length+'</b> · Registro <b>'+(S.open?'abierto':'cerrado')+'</b> · <b>'+ks.length+'</b> registrados';
  $('#lvTog').textContent=S.open?'Cerrar registro':'Abrir registro';
  $('#lvList').innerHTML=ks.sort(function(a,b){return S.people[a].ts-S.people[b].ts;}).map(function(d){return '<span>'+esc(fullname(d))+'<button data-lv="del" data-d="'+esc(d)+'">✕</button></span>';}).join('')||'<span style="background:none;color:#a9b0c3">Aún no hay alumnos registrados.</span>';
  liveBtn();
}
function drawTeams(){
  var ids=Object.keys(S.people);if(!ids.length)return;
  var k=Math.ceil(ids.length/S.size);ids=shuffle(ids);
  S.teams=defTeams(k);S.nid=100;S.members={};S.asg={};S.order=[];S.cur=0;S.board={};
  ids.forEach(function(d,i){var tid=(i%k)+1;(S.members[tid]=S.members[tid]||[]).push(d);S.asg[d]=tid;});
  sfx('win');burst(['🎲','⭐','✨']);
}
$('#live').addEventListener('click',function(e){
  var b=e.target.closest('[data-lv]');if(!b)return;var k=b.getAttribute('data-lv');
  if(k==='close'){show('live',false);return;}
  if(k==='toggle'){S.open=!S.open;save();livePub(true);}
  else if(k==='del'){delete S.people[b.getAttribute('data-d')];Object.keys(S.asg).forEach(function(d){if(!S.people[d])delete S.asg[d];});Object.keys(S.members).forEach(function(t){S.members[t]=S.members[t].filter(function(d){return !!S.people[d];});});save();livePub(true);}
  else if(k==='clear'){if(confirm('¿Borrar todos los registros y el sorteo?')){S.people={};S.asg={};S.members={};save();livePub(true);}}
  else if(k==='add'){var v=($('#lvIn').value||'').trim();if(v){var pt=v.split(/\s+/);S.people['m'+Math.random().toString(36).slice(2,9)]={nm:pt[0],ap:pt.slice(1).join(' '),ts:Date.now(),manual:1};$('#lvIn').value='';save();livePub(true);}}
  liveDraw();if(SL[S.idx].id==='sorteo')render();
});
$('#lvIn').addEventListener('keydown',function(e){if(e.key==='Enter'){e.stopPropagation();$('#live [data-lv=add]').click();}});

/* ================= Render ================= */
var lastGame=null;
function render(){
  var s=SL[S.idx];if(!s){S.idx=0;s=SL[0];}
  cv.classList.toggle('game',!!s.game);
  sl.innerHTML='<div class="top"><span class="kick">'+s.blk+'</span><span class="tm">⏱ min '+s.t+'</span></div>'+s.html(s);
  $('#ct').textContent=(S.idx+1)+' / '+SL.length;
  $('#prog').style.width=(100*(S.idx+1)/SL.length)+'%';
  var nt=$('#notes');nt.innerHTML='<h4>📝 Guía de la profesora · '+esc(s.title)+' <span style="color:#a9b0c3;font-weight:500">(min '+s.t+')</span></h4>'+s.notes+'<div class="help">Atajos: <kbd>←</kbd><kbd>→</kbd> navegar · <kbd>G</kbd> ir a · <kbd>N</kbd> guía · <kbd>T</kbd> cronómetro · <kbd>E</kbd> equipos · <kbd>R</kbd> al azar · <kbd>F</kbd> pantalla completa</div>';
  save();
  liveBtn();if($('#live').style.display==='block')liveDraw();
}
function go(i){S.idx=Math.max(0,Math.min(SL.length-1,i));render();}
function fit(){var k=Math.min(window.innerWidth/1920,window.innerHeight/1080);cv.style.transform='translate(-50%,-50%) scale('+k+')';}

/* ================= Acciones ================= */
function act(a){
  if(a==='draw'){S.order=shuffle(S.teams.map(function(t){return t.id;}));S.cur=0;sfx('start');}
  else if(a==='sz+'){S.size=Math.min(8,S.size+1);}
  else if(a==='sz-'){S.size=Math.max(2,S.size-1);}
  else if(a==='drawTeams'){drawTeams();}
  else if(a==='undoTeams'){S.asg={};S.members={};S.order=[];S.cur=0;}
  else if(a==='openLive'){bar('live');return;}
  else if(a==='lv+'||a==='lv-'||a==='ps+'||a==='ps-'){var id=S.order[S.cur];if(!id)return;var b=bd(id);if(a==='lv+'){b.lv++;sfx('ok');}else if(a==='lv-')b.lv=Math.max(0,b.lv-1);else if(a==='ps+'){b.ps=Math.min(3,b.ps+1);sfx('ok');}else b.ps=Math.max(0,b.ps-1);}
  else if(a==='nextTurn'){if(S.cur<S.order.length-1){S.cur++;sfx('start');}else{burst();sfx('win');}}
  else if(a==='prevTurn'){S.cur=Math.max(0,S.cur-1);}
  else if(a==='start5'){TM.left=300;TM.run=true;$('#timer').classList.remove('end');$('#timer').style.display='flex';tmUpdate();sfx('start');}
  else if(a==='burst'){burst();sfx('win');}
  render();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(b){act(b.getAttribute('data-act'));return;}
  var bb=e.target.closest('[data-b]');if(bb){bar(bb.getAttribute('data-b'));return;}
});

/* ================= Panels ================= */
function show(id,on){var p=$('#'+id);p.style.display=on===undefined?(p.style.display==='block'||p.style.display==='flex'||p.style.display==='grid'?'none':(id==='timer'?'flex':(id==='rand'?'grid':'block'))):(on?(id==='timer'?'flex':(id==='rand'?'grid':'block')):'none');}
function bar(k){
  if(k==='prev')go(S.idx-1);else if(k==='next')go(S.idx+1);
  else if(k==='goto'){buildGoto();show('goto');}
  else if(k==='live'){liveDraw();show('live');}
  else if(k==='notes')show('notes');
  else if(k==='timer')show('timer');
  else if(k==='teams'){buildTeams();show('modal');}
  else if(k==='rand')doRand();
  else if(k==='fs'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();}
}
function buildGoto(){var g=$('#goto');g.innerHTML='<h4>Ir a…</h4><div class="gg">'+SL.map(function(s,i){return '<button data-g="'+i+'" class="'+(i===S.idx?'cur':'')+'"><small>'+s.blk+' · min '+s.t+'</small>'+(i+1)+'. '+esc(s.title)+'</button>';}).join('')+'</div>';}
$('#goto').addEventListener('click',function(e){var b=e.target.closest('[data-g]');if(b){go(+b.getAttribute('data-g'));show('goto',false);}});
function buildTeams(){
  var m=$('#modal');
  m.innerHTML='<h4>👥 Equipos (agregar, renombrar, eliminar)</h4>'+S.teams.map(function(t){return '<div class="tr"><span class="dot" style="background:'+col(t)+'"></span><input data-n="'+t.id+'" value="'+esc(t.name)+'"><button class="mini" data-del="'+t.id+'">✕</button></div>';}).join('')
   +'<div class="row" style="margin-top:12px"><button class="mini" id="addT">＋ Agregar equipo</button><button class="mini" id="closeT">Cerrar</button><button class="mini" id="resetAll" style="margin-left:auto;background:#6b1414">Reiniciar todo</button></div>';
}
$('#modal').addEventListener('input',function(e){var n=e.target.getAttribute('data-n');if(n){var t=team(n);if(t){t.name=e.target.value;save();}}});
$('#modal').addEventListener('click',function(e){
  var d=e.target.closest('[data-del]');
  if(d){var id=+d.getAttribute('data-del');S.teams=S.teams.filter(function(t){return t.id!==id;});S.order=S.order.filter(function(x){return x!==id;});S.cur=Math.min(S.cur,Math.max(0,S.order.length-1));buildTeams();render();return;}
  if(e.target.id==='addT'){var id2=++S.nid;S.teams.push({id:id2,name:'Equipo '+(S.teams.length+1),c:S.teams.length%COLORS.length});buildTeams();render();}
  if(e.target.id==='closeT'){show('modal',false);render();}
  if(e.target.id==='resetAll'){if(confirm('¿Reiniciar equipos, orden y puntajes?')){S=fresh();save();buildTeams();render();}}
});
function doRand(){
  var ts=S.teams;if(!ts.length)return;$('#rand').style.display='grid';var n=0,big=$('#rbig');
  var iv=setInterval(function(){var t=ts[Math.floor(Math.random()*ts.length)];big.textContent=t.name;big.style.color=col(t);sfx('dice');if(++n>16){clearInterval(iv);sfx('ok');}},90);
}
$('#ragain').onclick=doRand;$('#rclose').onclick=function(){$('#rand').style.display='none';};

/* ================= Temporizador ================= */
var TM={left:0,run:false,t:null};
function tmUpdate(){var m=Math.floor(Math.max(0,TM.left)/60),s=Math.floor(Math.max(0,TM.left)%60);$('#tt').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
setInterval(function(){if(TM.run&&TM.left>0){TM.left-=1;tmUpdate();if(TM.left<=0){TM.run=false;$('#timer').classList.add('end');sfx('no');}}},1000);
$('#timer').addEventListener('click',function(e){var t=e.target.getAttribute('data-t');if(!t)return;
  if(t==='toggle')TM.run=!TM.run;else if(t==='reset'){TM.left=0;TM.run=false;$('#timer').classList.remove('end');}else if(t==='add60')TM.left+=60;else if(t==='sub60')TM.left=Math.max(0,TM.left-60);else if(t==='hide')$('#timer').style.display='none';tmUpdate();});

/* ================= Teclado / táctil ================= */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  var k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(S.idx+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(S.idx-1);}
  else if(k==='g'||k==='G')bar('goto');else if(k==='n'||k==='N')bar('notes');else if(k==='t'||k==='T')bar('timer');
  else if(k==='e'||k==='E')bar('teams');else if(k==='r'||k==='R')bar('rand');else if(k==='l'||k==='L')bar('live');else if(k==='f'||k==='F')bar('fs');
  else if(k==='Escape'){['goto','modal','notes','rand','live'].forEach(function(id){$('#'+id).style.display='none';});}
});
var sx=null;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(S.idx+(dx<0?1:-1));sx=null;},{passive:true});
window.addEventListener('resize',fit);
fit();render();liveStart();liveBtn();
})();
</script>
</body>
</html>
